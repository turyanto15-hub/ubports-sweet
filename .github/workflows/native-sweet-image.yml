
name: Native UBports Sweet - First Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 Image and Sweet DTB
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            make \
            python3 \
            rsync \
            git \
            device-tree-compiler

      - name: Clone SM7150 mainline kernel
        run: |
          git clone --depth=1 \
            --branch v7.2 \
            https://github.com/sm7150-mainline/linux.git kernel

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export OUT_DIR="$GITHUB_WORKSPACE/kernel/out"

          echo "===== CREATE BASE CONFIGURATION ====="

          make O="$OUT_DIR" defconfig

          echo
          echo "===== APPLY ARM64 CONFIGURATION ====="

          scripts/config --file "$OUT_DIR/.config" \
            --enable ARM64_4K_PAGES \
            --disable ARM64_16K_PAGES \
            --disable ARM64_64K_PAGES \
            --enable ARM64_VA_BITS_39 \
            --disable ARM64_VA_BITS_48 \
            --disable ARM64_VA_BITS_52 \
            --enable ARM64_PA_BITS_48 \
            --disable ARM64_PA_BITS_52

          make O="$OUT_DIR" olddefconfig

          echo
          echo "===== VERIFIED ARM64 CONFIG ====="

          grep -E 'CONFIG_ARM64_(4K_PAGES|VA_BITS|PA_BITS|LPA2)' \
            "$OUT_DIR/.config"

          grep -q '^CONFIG_ARM64_4K_PAGES=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_ARM64_VA_BITS_39=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_ARM64_VA_BITS=39$' "$OUT_DIR/.config"
          grep -q '^CONFIG_ARM64_PA_BITS_48=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_ARM64_PA_BITS=48$' "$OUT_DIR/.config"

          if grep -q '^CONFIG_ARM64_LPA2=y$' "$OUT_DIR/.config"; then
            echo "ERROR: LPA2 unexpectedly enabled"
            exit 1
          fi

          echo "PASS: ARM64 configuration verified."

      - name: Build kernel Image and Sweet DTB
        working-directory: kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export OUT_DIR="$GITHUB_WORKSPACE/kernel/out"

          DEVICE_DTB="sm7150-xiaomi-sweet.dtb"

          mkdir -p "$GITHUB_WORKSPACE/build-logs"

          echo "===== CHECK SWEET DTB TARGET ====="

          grep -n "sm7150-xiaomi-sweet.dtb" \
            arch/arm64/boot/dts/qcom/Makefile

          echo
          echo "===== BUILD IMAGE AND SWEET DTB ====="

          make O="$OUT_DIR" -j2 \
              Image \
              "qcom/$DEVICE_DTB" \
              2>&1 | tee "$GITHUB_WORKSPACE/build-logs/kernel-build.log"

          echo
          echo "===== OUTPUT CHECK ====="

          test -s "$OUT_DIR/arch/arm64/boot/Image"
          test -s "$OUT_DIR/arch/arm64/boot/dts/qcom/$DEVICE_DTB"

          echo "PASS: Image and Sweet DTB generated."

      - name: Verify build outputs
        working-directory: kernel
        run: |
          set -euo pipefail

          OUT_DIR="$GITHUB_WORKSPACE/kernel/out"

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"
          DTB="$OUT_DIR/arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb"

          echo "===== KERNEL IMAGE ====="
          file "$IMAGE"
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

          echo
          echo "===== SWEET DEVICE TREE ====="
          file "$DTB"
          ls -lh "$DTB"
          sha256sum "$DTB"

          echo
          echo "PASS: Both build outputs verified."

      - name: Upload Image and Sweet DTB
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE-UBPORT-SWEET-Image-and-DTB
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE-UBPORT-SWEET-Build-Logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7
