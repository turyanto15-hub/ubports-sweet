
name: Build Native UBports Kernel for Sweet

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-sweet-image.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Native UBports Kernel for Sweet
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KERNEL_DIR: kernel
      OUT_DIR: out
      DEVICE_DTB: sm7150-xiaomi-sweet.dtb

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            device-tree-compiler \
            make \
            python3 \
            rsync \
            git \
            zip \
            file \
            xz-utils \
            dwarves

      - name: Clone Native SM7150 kernel
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch v7.2 \
            https://github.com/turyanto15-hub/linux-native.git \
            "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo "===== KERNEL REPOSITORY ====="
          git remote -v

          echo
          echo "===== KERNEL COMMIT ====="
          git log -1 --oneline

          echo
          echo "===== KERNEL VERSION ====="
          make kernelversion

          echo
          echo "===== SWEET DTS CHECK ====="
          test -s arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dts
          echo "PASS: Sweet DTS found"

          echo
          echo "===== DTS MAKEFILE CHECK ====="
          grep -n "sm7150-xiaomi-sweet" \
            arch/arm64/boot/dts/qcom/Makefile

          echo
          echo "===== CONFIG FRAGMENT CHECK ====="
          test -s arch/arm64/configs/sm7150.config
          echo "PASS: sm7150.config found"

          echo
          echo "===== PANEL DRIVER CHECK ====="
          grep -R -n "config DRM_PANEL_SAMSUNG_AMS667YR01" \
            drivers/gpu/drm/panel

          echo
          echo "===== GOODIX DRIVER CHECK ====="
          grep -R -n "config TOUCHSCREEN_GOODIX_GTX8" \
            drivers/input/touchscreen

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p "$OUT_DIR"

          echo "===== BASE DEFCONFIG ====="
          make O="$OUT_DIR" defconfig

          echo
          echo "===== MERGE SM7150 CONFIG FRAGMENT ====="

          scripts/kconfig/merge_config.sh \
            -m \
            -O "$OUT_DIR" \
            "$OUT_DIR/.config" \
            arch/arm64/configs/sm7150.config

          echo
          echo "===== ENABLE REQUIRED SWEET FEATURES ====="

          scripts/config --file "$OUT_DIR/.config" \
            --enable ARCH_QCOM \
            --enable OF \
            --enable MODULES \
            --enable IOMMU_SUPPORT \
            --enable COMMON_CLK \
            --enable PM \
            --enable QCOM_AOSS_QMP \
            --enable QCOM_OCMEM \
            --enable QCOM_LLCC \
            --enable QCOM_COMMAND_DB \
            --enable REGULATOR \
            --enable GPIOLIB \
            --enable PINCTRL \
            --enable I2C \
            --enable INPUT \
            --enable INPUT_EVDEV \
            --enable INPUT_TOUCHSCREEN \
            --enable BACKLIGHT_CLASS_DEVICE \
            --enable DRM \
            --enable DRM_KMS_HELPER \
            --enable DRM_GEM_SHMEM_HELPER \
            --enable DRM_MSM \
            --enable DRM_MSM_DSI \
            --enable DRM_PANEL \
            --enable BLK_DEV_INITRD \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable EXT4_FS \
            --enable TMPFS \
            --enable FW_LOADER

          echo
          echo "===== ENABLE SWEET PANEL ====="

          scripts/config --file "$OUT_DIR/.config" \
            --enable DRM_PANEL_SAMSUNG_AMS667YR01

          echo
          echo "===== ENABLE GOODIX GTX8 ====="

          scripts/config --file "$OUT_DIR/.config" \
            --enable TOUCHSCREEN_GOODIX_GTX8

          echo
          echo "===== FINAL OLDDEFCONFIG ====="

          make O="$OUT_DIR" olddefconfig

          echo
          echo "===== FINAL CONFIGURATION ====="

          grep -E \
            '^(CONFIG_ARCH_QCOM|CONFIG_OF|CONFIG_MODULES|CONFIG_IOMMU_SUPPORT|CONFIG_COMMON_CLK|CONFIG_PM|CONFIG_QCOM_AOSS_QMP|CONFIG_QCOM_OCMEM|CONFIG_QCOM_LLCC|CONFIG_QCOM_COMMAND_DB|CONFIG_DRM=|CONFIG_DRM_MSM=|CONFIG_DRM_MSM_KMS=|CONFIG_DRM_MSM_DSI=|CONFIG_DRM_PANEL_SAMSUNG_AMS667YR01=|CONFIG_TOUCHSCREEN_GOODIX_GTX8=)' \
            "$OUT_DIR/.config" || true

          echo
          echo "===== DRM MSM KCONFIG DEPENDENCIES ====="

          grep -n -A30 '^config DRM_MSM$' \
            drivers/gpu/drm/msm/Kconfig

          echo
          echo "===== DRM MSM CONFIG STATE ====="

          grep -E \
            '^(CONFIG_DRM_MSM=|# CONFIG_DRM_MSM is not set)' \
            "$OUT_DIR/.config" || true

          if ! grep -q '^CONFIG_DRM_MSM=y$' "$OUT_DIR/.config"; then
            echo
            echo "ERROR: CONFIG_DRM_MSM is not built-in."
            echo "Checking dependencies..."

            grep -E \
              '^(CONFIG_ARCH_QCOM|CONFIG_DRM=|CONFIG_COMMON_CLK|CONFIG_IOMMU_SUPPORT|CONFIG_OF|CONFIG_PM|CONFIG_QCOM_AOSS_QMP|CONFIG_QCOM_OCMEM|CONFIG_QCOM_LLCC|CONFIG_QCOM_COMMAND_DB)' \
              "$OUT_DIR/.config" || true

            exit 1
          fi

          echo
          echo "PASS: CONFIG_DRM_MSM=y"

          echo
          echo "===== REQUIRED CONFIG VALIDATION ====="

          for symbol in \
            ARCH_QCOM \
            OF \
            MODULES \
            IOMMU_SUPPORT \
            COMMON_CLK \
            PM \
            DRM \
            DRM_MSM \
            DRM_MSM_DSI \
            DRM_PANEL \
            DRM_PANEL_SAMSUNG_AMS667YR01 \
            TOUCHSCREEN_GOODIX_GTX8 \
            BACKLIGHT_CLASS_DEVICE
          do
            if grep -q "^CONFIG_${symbol}=y$" "$OUT_DIR/.config"; then
              echo "PASS: CONFIG_${symbol}=y"
            else
              echo "ERROR: CONFIG_${symbol} is not enabled as built-in."
              exit 1
            fi
          done

          echo
          echo "===== SAVE FINAL KERNEL CONFIG ====="

          cp "$OUT_DIR/.config" ../kernel.config

      - name: Build kernel Image and device trees
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p ../build-logs

          echo "===== BUILD IMAGE AND DTBS ====="

          make O="$OUT_DIR" \
            -j2 \
            Image dtbs \
            2>&1 | tee ../build-logs/kernel-build.log

          echo
          echo "===== BUILD OUTPUT CHECK ====="

          test -s "$OUT_DIR/arch/arm64/boot/Image"
          echo "PASS: Kernel Image generated."

      - name: Validate kernel Image
        working-directory: kernel
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"

          echo "===== IMAGE VALIDATION ====="

          test -s "$IMAGE"
          file "$IMAGE"
          ls -lh "$IMAGE"

          echo
          echo "===== IMAGE SHA256 ====="

          sha256sum "$IMAGE"

      - name: Validate Sweet DTB
        working-directory: kernel
        run: |
          set -euo pipefail

          DTB="$OUT_DIR/arch/arm64/boot/dts/qcom/$DEVICE_DTB"

          echo "===== SWEET DTB VALIDATION ====="

          if [ ! -s "$DTB" ]; then
            echo "ERROR: Sweet DTB not found:"
            echo "$DTB"

            echo
            echo "===== AVAILABLE DTB FILES ====="

            find "$OUT_DIR/arch/arm64/boot/dts" \
              -type f -name '*.dtb' -print

            exit 1
          fi

          file "$DTB"
          ls -lh "$DTB"

          echo
          echo "===== DTB SHA256 ====="

          sha256sum "$DTB"

          echo
          echo "===== DTB COMPATIBLE ====="

          fdtget "$DTB" / compatible

      - name: Prepare Native UBports artifacts
        run: |
          set -euo pipefail

          mkdir -p dist

          cp kernel/out/arch/arm64/boot/Image \
            dist/Image

          cp kernel/out/arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb \
            dist/sm7150-xiaomi-sweet.dtb

          cp kernel.config \
            dist/kernel.config

          cp build-logs/kernel-build.log \
            dist/kernel-build.log

          echo "===== FINAL ARTIFACTS ====="

          ls -lh dist/

          echo
          echo "===== SHA256 ====="

          sha256sum dist/Image \
            dist/sm7150-xiaomi-sweet.dtb \
            dist/kernel.config

      - name: Upload Native UBports Sweet Image
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE-UBPORT-SWEET-First-Image
          path: dist/*
          if-no-files-found: error
          retention-days: 14
