
name: Native UBports Sweet Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ubports-sweet
  cancel-in-progress: true

jobs:
  build:
    name: Build Native Linux for Redmi Note 10 Pro
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      JOBS: 2

    steps:

      # 1. Checkout native kernel fork
      - name: Checkout native kernel
        uses: actions/checkout@v4
        with:
          repository: turyanto15-hub/linux-native
          ref: v7.2
          path: kernel
          fetch-depth: 1

      # 2. Install build dependencies
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            device-tree-compiler \
            dwarves \
            file \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            make \
            python3 \
            rsync \
            unzip \
            zip

          echo "===== GCC VERSION ====="
          aarch64-linux-gnu-gcc --version | head -1

          echo "===== DTC VERSION ====="
          dtc --version

      # 3. Verify native kernel source
      - name: Verify native kernel source
        working-directory: kernel
        run: |
          set -e

          echo "===== REPOSITORY ====="
          git remote -v

          echo "===== COMMIT ====="
          git log -1 --format='%H%n%s'

          echo "===== KERNEL VERSION ====="
          make kernelversion

          echo "===== VERIFY CONFIG FRAGMENT ====="
          test -s arch/arm64/configs/sm7150.config

          echo "===== VERIFY SWEET DTS ====="
          test -s arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dts

          echo "===== VERIFY DRIVER SOURCE ====="
          test -s drivers/input/touchscreen/goodix_gtx8.c
          test -s drivers/gpu/drm/panel/panel-samsung-ams667yr01.c

          echo "NATIVE SOURCE VALIDATION: PASS"

      # 4. Initialize base kernel configuration
      - name: Initialize kernel configuration
        working-directory: kernel
        run: |
          set -e

          mkdir -p out

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            defconfig

          test -s out/.config

          echo "BASE DEFCONFIG: PASS"

      # 5. Merge SM7150 configuration
      - name: Merge SM7150 configuration
        working-directory: kernel
        run: |
          set -e

          bash scripts/kconfig/merge_config.sh \
            -m \
            -O out \
            out/.config \
            arch/arm64/configs/sm7150.config

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          test -s out/.config

          echo "SM7150 CONFIGURATION MERGE: PASS"

      # 6. Enable Sweet hardware drivers and build
      - name: Enable Sweet hardware drivers
        working-directory: kernel
        run: |
          set -e

          scripts/config --file out/.config \
            --enable I2C \
            --enable OF \
            --enable GPIOLIB \
            --enable REGULATOR \
            --enable INPUT \
            --enable DRM \
            --enable DRM_MSM \
            --enable DRM_MIPI_DSI \
            --enable BACKLIGHT_CLASS_DEVICE \
            --enable TOUCHSCREEN_GOODIX_GTX8 \
            --enable DRM_PANEL_SAMSUNG_AMS667YR01

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "===== FINAL HARDWARE CONFIGURATION ====="

          grep -E \
            '^(CONFIG_I2C|CONFIG_OF|CONFIG_GPIOLIB|CONFIG_REGULATOR|CONFIG_INPUT|CONFIG_DRM|CONFIG_DRM_MSM|CONFIG_DRM_MIPI_DSI|CONFIG_BACKLIGHT_CLASS_DEVICE|CONFIG_TOUCHSCREEN_GOODIX_GTX8|CONFIG_DRM_PANEL_SAMSUNG_AMS667YR01)=' \
            out/.config || true

          echo "===== VALIDATE REQUIRED DRIVERS ====="

          grep -q '^CONFIG_TOUCHSCREEN_GOODIX_GTX8=y$' out/.config
          grep -q '^CONFIG_DRM_PANEL_SAMSUNG_AMS667YR01=y$' out/.config
          grep -q '^CONFIG_DRM_MSM=y$' out/.config
          grep -q '^CONFIG_DRM_MIPI_DSI=y$' out/.config
          grep -q '^CONFIG_BACKLIGHT_CLASS_DEVICE=y$' out/.config

          echo "SWEET HARDWARE CONFIGURATION: PASS"

      - name: Build native kernel and Sweet DTB
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "===== BUILD INFORMATION ====="
          echo "Architecture: $ARCH"
          echo "Compiler: $CROSS_COMPILE"
          echo "Jobs: $JOBS"

          echo "===== BUILD START ====="

          make -j"$JOBS" O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image \
            qcom/sm7150-xiaomi-sweet.dtb \
            2>&1 | tee build.log

          echo "NATIVE KERNEL BUILD: PASS"

      # 7. Verify and package build outputs
      - name: Verify build outputs
        working-directory: kernel
        run: |
          set -e

          IMAGE="out/arch/arm64/boot/Image"
          DTB="out/arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb"

          echo "===== VERIFY KERNEL IMAGE ====="
          test -s "$IMAGE"
          ls -lh "$IMAGE"
          file "$IMAGE"

          echo "===== VERIFY SWEET DTB ====="
          test -s "$DTB"
          ls -lh "$DTB"
          file "$DTB"

          echo "===== VERIFY CONFIGURATION ====="
          test -s out/.config
          ls -lh out/.config

          echo "===== VERIFY SYSTEM MAP ====="
          test -s out/System.map
          ls -lh out/System.map

          echo "===== VERIFY BUILD LOG ====="
          test -s build.log
          ls -lh build.log

          echo "===== ALL BUILD OUTPUTS VERIFIED ====="

      # Upload artifacts even if build fails
      - name: Upload native Sweet kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE-UBPORT-SWEET-Image-and-DTB
          if-no-files-found: warn
          path: |
            kernel/build.log
            kernel/out/.config
            kernel/out/System.map
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb
