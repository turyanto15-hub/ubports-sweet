
name: Native UBports Sweet - First Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 Image
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            make \
            python3 \
            rsync \
            git

      - name: Clone SM7150 mainline kernel
        run: |
          git clone --depth=1 \
            --branch v7.2 \
            https://github.com/sm7150-mainline/linux.git kernel

      - name: Configure kernel
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- defconfig

          scripts/config --file out/.config \
            --enable ARM64_4K_PAGES \
            --disable ARM64_16K_PAGES \
            --disable ARM64_64K_PAGES \
            --enable ARM64_VA_BITS_39 \
            --disable ARM64_VA_BITS_48 \
            --disable ARM64_VA_BITS_52 \
            --enable ARM64_PA_BITS_48 \
            --disable ARM64_PA_BITS_52

          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "===== VERIFIED ARM64 CONFIG ====="
          grep -E 'CONFIG_ARM64_(4K_PAGES|VA_BITS|PA_BITS|LPA2)' out/.config

          grep -q '^CONFIG_ARM64_4K_PAGES=y$' out/.config
          grep -q '^CONFIG_ARM64_VA_BITS_39=y$' out/.config
          grep -q '^CONFIG_ARM64_VA_BITS=39$' out/.config
          grep -q '^CONFIG_ARM64_PA_BITS_48=y$' out/.config
          grep -q '^CONFIG_ARM64_PA_BITS=48$' out/.config

          if grep -q '^CONFIG_ARM64_LPA2=y$' out/.config; then
            echo "ERROR: LPA2 unexpectedly enabled"
            exit 1
          fi

      - name: Build kernel Image and Sweet DTB
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p ../build-logs

          echo "===== CHECK SWEET DTB TARGET ====="
          grep -n "sm7150-xiaomi-sweet.dtb" \
            arch/arm64/boot/dts/qcom/Makefile

          echo
          echo "===== BUILD IMAGE AND SWEET DTB ====="
          make O="$OUT_DIR" -j2 \
            Image \
            arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb \
            2>&1 | tee ../build-logs/kernel-build.log

          echo
          echo "===== OUTPUT CHECK ====="
          test -s "$OUT_DIR/arch/arm64/boot/Image"
          test -s "$OUT_DIR/arch/arm64/boot/dts/qcom/$DEVICE_DTB"

          echo "PASS: Image and Sweet DTB generated."

      - name: Verify Image
        working-directory: kernel
        run: |
          IMAGE="out/arch/arm64/boot/Image"

          test -s "$IMAGE"
          file "$IMAGE"
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE-UBPORT-SWEET-First-Image
          path: kernel/out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 14
