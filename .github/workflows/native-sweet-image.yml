
name: NATIVE UBPORT SWEET - Kernel Image DTB DTBO Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-sweet-image.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Native UBports Kernel for Sweet
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KERNEL_DIR: kernel
      OUT_DIR: out
      DEVICE_DTB: sm7150-xiaomi-sweet.dtb

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            device-tree-compiler \
            make \
            python3 \
            rsync \
            git \
            zip \
            file \
            xz-utils

      - name: Clone SM7150 mainline kernel
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch v7.2 \
            https://github.com/sm7150-mainline/linux.git \
            "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo "===== KERNEL SOURCE ====="
          git log -1 --oneline
          make kernelversion

          echo
          echo "===== SWEET DTS CHECK ====="
          test -f arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dts
          echo "PASS: Sweet DTS found"

          echo
          echo "===== DTS MAKEFILE CHECK ====="
          grep -n "sm7150-xiaomi-sweet" \
            arch/arm64/boot/dts/qcom/Makefile || true

          echo
          echo "===== PANEL DRIVER CHECK ====="
          grep -R -n "DRM_PANEL_SAMSUNG_AMS667YR01" \
            drivers/gpu/drm/panel || true

          echo
          echo "===== GOODIX DRIVER CHECK ====="
          grep -R -n "TOUCHSCREEN_GOODIX_GTX8" \
            drivers/input/touchscreen || true

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p "$OUT_DIR"

          echo "===== BASE DEFCONFIG ====="
          make O="$OUT_DIR" defconfig

          echo
          echo "===== ENABLE BASE FEATURES ====="

          scripts/config --file "$OUT_DIR/.config" \
            --enable ARCH_QCOM \
            --enable OF \
            --enable MODULES \
            --enable IOMMU_SUPPORT \
            --enable COMMON_CLK \
            --enable PM \
            --enable REGULATOR \
            --enable GPIOLIB \
            --enable PINCTRL \
            --enable I2C \
            --enable INPUT \
            --enable INPUT_EVDEV \
            --enable INPUT_TOUCHSCREEN \
            --enable BACKLIGHT_CLASS_DEVICE \
            --enable DRM \
            --enable DRM_KMS_HELPER \
            --enable DRM_GEM_SHMEM_HELPER \
            --enable DRM_MSM \
            --enable DRM_MSM_KMS \
            --enable DRM_MSM_DSI \
            --enable DRM_PANEL \
            --enable BLK_DEV_INITRD \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable EXT4_FS \
            --enable TMPFS \
            --enable FW_LOADER

          echo
          echo "===== OPTIONAL PANEL DRIVER ====="

          if grep -R -q "config DRM_PANEL_SAMSUNG_AMS667YR01" \
            drivers/gpu/drm/panel; then
            scripts/config --file "$OUT_DIR/.config" \
              --enable DRM_PANEL_SAMSUNG_AMS667YR01
            echo "AMS667YR01 symbol found and enabled."
          else
            echo "WARNING: AMS667YR01 symbol not found."
          fi

          echo
          echo "===== OPTIONAL GOODIX GTX8 DRIVER ====="

          if grep -R -q "config TOUCHSCREEN_GOODIX_GTX8" \
            drivers/input/touchscreen; then
            scripts/config --file "$OUT_DIR/.config" \
              --enable TOUCHSCREEN_GOODIX_GTX8
            echo "Goodix GTX8 symbol found and enabled."
          else
            echo "WARNING: Goodix GTX8 symbol not found."
          fi

          echo
          echo "===== OLDDEFCONFIG ====="
          make O="$OUT_DIR" olddefconfig

          echo
          echo "===== FINAL CONFIGURATION ====="
          grep -E \
            '^(CONFIG_ARCH_QCOM|CONFIG_OF|CONFIG_MODULES|CONFIG_IOMMU_SUPPORT|CONFIG_COMMON_CLK|CONFIG_PM|CONFIG_REGULATOR|CONFIG_GPIOLIB|CONFIG_I2C|CONFIG_INPUT|CONFIG_INPUT_TOUCHSCREEN|CONFIG_BACKLIGHT_CLASS_DEVICE|CONFIG_DRM=|CONFIG_DRM_KMS_HELPER|CONFIG_DRM_GEM_SHMEM_HELPER|CONFIG_DRM_MSM|CONFIG_DRM_PANEL|CONFIG_DRM_PANEL_SAMSUNG_AMS667YR01|CONFIG_TOUCHSCREEN_GOODIX_GTX8|CONFIG_BLK_DEV_INITRD|CONFIG_DEVTMPFS|CONFIG_EXT4_FS|CONFIG_TMPFS)' \
            "$OUT_DIR/.config" || true

          echo
          echo "===== DRM MSM KCONFIG DEPENDENCIES ====="
          grep -n -A45 '^config DRM_MSM$' \
            drivers/gpu/drm/msm/Kconfig || true

          echo
          echo "===== DRM MSM CONFIG STATE ====="
          grep -E '^CONFIG_DRM_MSM=|^# CONFIG_DRM_MSM is not set' \
            "$OUT_DIR/.config" || true

          if ! grep -q '^CONFIG_DRM_MSM=y$' "$OUT_DIR/.config"; then
            echo
            echo "ERROR: CONFIG_DRM_MSM is not built-in."
            echo "The Kconfig dependencies or architecture selection"
            echo "prevented DRM MSM from being enabled."
            exit 1
          fi

          echo
          echo "===== REQUIRED CONFIG VALIDATION ====="

          for symbol in \
            ARCH_QCOM \
            OF \
            I2C \
            INPUT \
            INPUT_TOUCHSCREEN \
            DRM \
            DRM_MSM \
            DRM_MSM_KMS \
            DRM_MSM_DSI \
            DRM_PANEL
          do
            if grep -q "^CONFIG_${symbol}=y$" "$OUT_DIR/.config"; then
              echo "PASS: CONFIG_${symbol}=y"
            else
              echo "ERROR: CONFIG_${symbol} is not enabled as built-in."
              exit 1
            fi
          done

          cp "$OUT_DIR/.config" ../kernel.config

      - name: Build kernel Image and device trees
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p ../build-logs

          echo "===== BUILD IMAGE AND DTBS ====="

          make O="$OUT_DIR" \
            -j2 \
            Image dtbs \
            2>&1 | tee ../build-logs/kernel-build.log

          echo
          echo "===== BUILD OUTPUT CHECK ====="

          test -s "$OUT_DIR/arch/arm64/boot/Image"
          echo "PASS: Kernel Image generated."

      - name: Validate kernel Image
        working-directory: kernel
        run: |
          set -euo pipefail

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"

          echo "===== IMAGE VALIDATION ====="
          test -s "$IMAGE"
          file "$IMAGE"
          ls -lh "$IMAGE"

          echo
          echo "===== IMAGE SIZE ====="
          stat -c '%n : %s bytes' "$IMAGE"

      - name: Validate Sweet DTB
        working-directory: kernel
        run: |
          set -euo pipefail

          DTB="$OUT_DIR/arch/arm64/boot/dts/qcom/$DEVICE_DTB"

          echo "===== SWEET DTB VALIDATION ====="

          if [ ! -s "$DTB" ]; then
            echo "ERROR: Sweet DTB not found:"
            echo "$DTB"
            find "$OUT_DIR/arch/arm64/boot/dts" \
              -type f -name '*.dtb' -print
            exit 1
          fi

          file "$DTB"
          ls -lh "$DTB"

          echo
          echo "===== DTB DECOMPILE CHECK ====="

          dtc -I dtb -O dts "$DTB" \
            -o ../sweet-audit.dts

          test -s ../sweet-audit.dts
          echo "PASS: DTB can be decompiled."

          echo
          echo "===== SWEET COMPATIBLE ====="
          grep -n -m 10 -i "xiaomi,sweet\|sweet" \
            ../sweet-audit.dts || true

      - name: Discover and validate Sweet DTBO
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p ../artifacts/dtbo

          echo "===== SEARCH DTBO ====="

          find "$OUT_DIR/arch/arm64/boot/dts" \
            -type f -name '*sweet*.dtbo' -print \
            | tee ../build-logs/sweet-dtbo-list.txt

          COUNT=$(find "$OUT_DIR/arch/arm64/boot/dts" \
            -type f -name '*sweet*.dtbo' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No Sweet DTBO generated."
            echo "All generated DTBO files:"
            find "$OUT_DIR/arch/arm64/boot/dts" \
              -type f -name '*.dtbo' -print
            exit 1
          fi

          echo
          echo "===== COPY AND VALIDATE DTBO ====="

          while IFS= read -r -d '' DTBO; do
            NAME=$(basename "$DTBO")

            cp "$DTBO" "../artifacts/dtbo/$NAME"

            echo
            echo "Checking: $NAME"
            file "$DTBO"

            dtc -I dtb -O dts "$DTBO" \
              -o "/tmp/${NAME}.dts"

            test -s "/tmp/${NAME}.dts"
            echo "PASS: $NAME"
          done < <(
            find "$OUT_DIR/arch/arm64/boot/dts" \
              -type f -name '*sweet*.dtbo' -print0
          )

      - name: Prepare kernel artifacts
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p ../artifacts

          echo "===== COPY KERNEL IMAGE ====="
          cp "$OUT_DIR/arch/arm64/boot/Image" \
            ../artifacts/Image

          echo
          echo "===== COPY SWEET DTB ====="
          cp "$OUT_DIR/arch/arm64/boot/dts/qcom/$DEVICE_DTB" \
            ../artifacts/

          echo
          echo "===== COPY CONFIGURATION ====="
          cp "$OUT_DIR/.config" ../artifacts/kernel.config

          echo
          echo "===== COPY BUILD LOG ====="
          cp ../build-logs/kernel-build.log \
            ../artifacts/kernel-build.log

          cp ../build-logs/sweet-dtbo-list.txt \
            ../artifacts/ || true

          echo
          echo "===== OPTIONAL SYSTEM MAP ====="
          if [ -s "$OUT_DIR/System.map" ]; then
            cp "$OUT_DIR/System.map" ../artifacts/
          fi

          echo
          echo "===== BUILD MANIFEST ====="

          {
            echo "Project: Native UBports Sweet"
            echo "Device: Xiaomi Redmi Note 10 Pro"
            echo "Codename: sweet"
            echo "Kernel source: sm7150-mainline/linux"
            echo "Kernel branch: v7.2"
            echo "Kernel version: $(make kernelversion)"
            echo "Architecture: arm64"
            echo "Compiler: $(aarch64-linux-gnu-gcc --version | head -n 1)"
            echo "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Artifacts:"
            find ../artifacts -type f -printf '%P : %s bytes\n' \
              | sort
          } > ../artifacts/MANIFEST.txt

          echo
          echo "===== SHA256 CHECKSUMS ====="

          cd ../artifacts

          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

          echo
          echo "===== CREATE ZIP ====="

          cd ..
          zip -r NATIVE-UBPORT-SWEET-Image-DTB-DTBO.zip artifacts

      - name: Final artifact validation
        run: |
          set -euo pipefail

          echo "===== FINAL FILE CHECK ====="

          test -s artifacts/Image
          test -s "artifacts/$DEVICE_DTB"
          test -s artifacts/kernel.config
          test -s artifacts/kernel-build.log
          test -s artifacts/MANIFEST.txt
          test -s artifacts/SHA256SUMS
          test -s NATIVE-UBPORT-SWEET-Image-DTB-DTBO.zip

          echo
          echo "===== ARTIFACT CONTENTS ====="
          find artifacts -type f -printf '%P : %s bytes\n' | sort

          echo
          echo "===== CHECKSUM VALIDATION ====="
          cd artifacts
          sha256sum -c SHA256SUMS

          echo
          echo "===== ZIP VALIDATION ====="
          cd ..
          unzip -t NATIVE-UBPORT-SWEET-Image-DTB-DTBO.zip

          echo
          echo "SUCCESS: Native UBports Sweet artifacts validated."

      - name: Upload Native UBports artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE-UBPORT-SWEET-Image-DTB-DTBO
          path: |
            artifacts/
            NATIVE-UBPORT-SWEET-Image-DTB-DTBO.zip
            sweet-audit.dts
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
