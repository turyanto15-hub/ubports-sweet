
name: Native UBports Sweet Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 Image and Sweet DTB
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      JOBS: 2
      EXPECTED_COMMIT: 477b07522c115b2523e1d8a8f784e93b11a3054f
      OUT: out

    steps:
      - name: Checkout Sweet kernel source
        uses: actions/checkout@v4
        with:
          repository: turyanto15-hub/linux-native
          ref: 477b07522c115b2523e1d8a8f784e93b11a3054f
          fetch-depth: 1
          path: kernel

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            python3 \
            rsync \
            dwarves \
            zip

      - name: Verify source revision and Sweet support
        working-directory: kernel
        run: |
          set -euo pipefail

          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          echo "Expected: $EXPECTED_COMMIT"
          echo "Actual:   $ACTUAL_COMMIT"
          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"

          test -f arch/arm64/configs/sm7150.config
          test -f arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dts
          test -f drivers/gpu/drm/panel/panel-samsung-ams667yr01.c
          test -f drivers/gpu/drm/msm/dsi/dsi_host.c

          grep -n 'slice_per_pkt' \
            drivers/gpu/drm/msm/dsi/dsi_host.c
          grep -n 'slice_per_pkt = 2' \
            drivers/gpu/drm/panel/panel-samsung-ams667yr01.c

      - name: Configure ARM64 kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          make O="$OUT" ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" defconfig

          ./scripts/kconfig/merge_config.sh -m -O "$OUT" \
            "$OUT/.config" \
            arch/arm64/configs/sm7150.config

          ./scripts/config --file "$OUT/.config" \
            --enable ARM64_4K_PAGES \
            --enable ARM64_VA_BITS_39 \
            --enable ARM64_PA_BITS_48 \
            --disable ARM64_LPA2 \
            --disable ARM64_16K_PAGES \
            --disable ARM64_64K_PAGES \
            --enable BLK_DEV_LOOP \
            --enable EXT4_FS \
            --enable EXFAT_FS \
            --enable NLS \
            --enable NLS_UTF8 \
            --enable DRM \
            --enable DRM_MSM \
            --enable DRM_MSM_DSI \
            --enable DRM_PANEL_SAMSUNG_AMS667YR01 \
            --enable TOUCHSCREEN_GOODIX_GTX8

          make O="$OUT" ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" olddefconfig

      - name: Validate final kernel configuration
        working-directory: kernel
        run: |
          set -euo pipefail
          CONFIG="$OUT/.config"

          require_config() {
            if ! grep -qx "$1=y" "$CONFIG"; then
              echo "::error::Required config missing: $1=y"
              exit 1
            fi
            echo "OK: $1=y"
          }

          require_config CONFIG_ARM64_4K_PAGES
          require_config CONFIG_ARM64_VA_BITS_39
          require_config CONFIG_ARM64_PA_BITS_48
          require_config CONFIG_BLK_DEV_LOOP
          require_config CONFIG_EXT4_FS
          require_config CONFIG_EXFAT_FS
          require_config CONFIG_NLS
          require_config CONFIG_NLS_UTF8
          require_config CONFIG_DRM
          require_config CONFIG_DRM_MSM
          require_config CONFIG_DRM_MSM_DSI
          require_config CONFIG_DRM_PANEL_SAMSUNG_AMS667YR01
          require_config CONFIG_TOUCHSCREEN_GOODIX_GTX8

          if grep -q '^CONFIG_ARM64_LPA2=y' "$CONFIG"; then
            echo "::error::LPA2 must be disabled for this target"
            exit 1
          fi

          cp "$CONFIG" kernel.config

      - name: Build kernel Image and Sweet DTB
        working-directory: kernel
        run: |
          set -euo pipefail

          make -j"$JOBS" O="$OUT" ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            Image dtbs 2>&1 | tee kernel-build.log

          test -s "$OUT/arch/arm64/boot/Image"
          test -s "$OUT/arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb"
          test -s "$OUT/System.map"

      - name: Verify build outputs
        working-directory: kernel
        run: |
          set -euo pipefail

          file "$OUT/arch/arm64/boot/Image"
          file "$OUT/arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb"

          test "$(stat -c%s "$OUT/arch/arm64/boot/Image")" -gt 1000000
          test "$(stat -c%s "$OUT/arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb")" -gt 1000

      - name: Package kernel artifact
        working-directory: kernel
        run: |
          set -euo pipefail

          PACKAGE="NATIVE-UBPORT-SWEET-IMAGE"
          mkdir -p "$PACKAGE"

          cp "$OUT/arch/arm64/boot/Image" "$PACKAGE/Image"
          cp "$OUT/arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb" \
            "$PACKAGE/sm7150-xiaomi-sweet.dtb"
          cp "$OUT/System.map" "$PACKAGE/System.map"
          cp kernel.config "$PACKAGE/kernel.config"
          cp kernel-build.log "$PACKAGE/kernel-build.log"

          cat > "$PACKAGE/manifest.txt" <<EOF
          Project: Native UBports Sweet
          Device: Xiaomi Redmi Note 10 Pro
          Codename: sweet
          Architecture: ARM64
          Kernel repository: https://github.com/turyanto15-hub/linux-native
          Source commit: $EXPECTED_COMMIT
          Build targets: Image, sm7150-xiaomi-sweet.dtb
          ARM64 page size: 4K
          ARM64 virtual address: 39-bit
          ARM64 physical address: 48-bit
          LPA2: disabled
          Loop device: built-in
          Root image filesystem: ext4
          microSD filesystem: exFAT
          exFAT driver: built-in
          DSC slice_per_pkt: 2
          Artifact purpose: Native UBports Sweet kernel
          EOF

          (
            cd "$PACKAGE"
            sha256sum Image sm7150-xiaomi-sweet.dtb \
              System.map kernel.config kernel-build.log \
              manifest.txt > SHA256SUMS
          )

          zip -r NATIVE-UBPORT-SWEET-IMAGE.zip "$PACKAGE"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE-UBPORT-SWEET-IMAGE
          path: kernel/NATIVE-UBPORT-SWEET-IMAGE.zip
          if-no-files-found: error
          retention-days: 30
