
name: NATIVE UBPORT SWEET - First Kernel Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-sweet-image.yml"

permissions:
  contents: read

jobs:
  build-image:
    name: Build ARM64 Kernel Image and DTB
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            device-tree-compiler \
            make \
            python3 \
            rsync

      - name: Clone SM7150 mainline kernel
        run: |
          git clone --depth=1 \
            --branch v7.2 \
            https://github.com/sm7150-mainline/linux.git kernel

          cd kernel

          echo "===== SOURCE COMMIT ====="
          git rev-parse HEAD

          echo "===== KERNEL VERSION ====="
          make kernelversion

          echo "===== SWEET DTS CHECK ====="
          test -s arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dts

          grep -n "sm7150-xiaomi-sweet.dtb" \
            arch/arm64/boot/dts/qcom/Makefile

      - name: Configure ARM64 kernel
        run: |
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out defconfig

          ./scripts/config --file out/.config \
            --enable ARCH_QCOM \
            --enable OF

          make O=out olddefconfig

          echo "===== CONFIGURATION ====="
          grep -E \
            '^CONFIG_ARM64=y|^CONFIG_64BIT=y|^CONFIG_ARCH_QCOM=y|^CONFIG_OF=y' \
            out/.config

      - name: Build kernel Image and Device Trees
        run: |
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out -j2 Image dtbs

      - name: Validate Image and sweet DTB
        run: |
          cd kernel

          IMAGE="out/arch/arm64/boot/Image"
          DTB="out/arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb"

          echo "===== IMAGE CHECK ====="

          test -s "$IMAGE"
          file "$IMAGE"
          sha256sum "$IMAGE"

          echo "===== SWEET DTB CHECK ====="

          test -s "$DTB"
          file "$DTB"
          sha256sum "$DTB"

          echo "===== DTB COMPATIBLE CHECK ====="

          fdtget "$DTB" / compatible

      - name: Prepare Native UBports artifacts
        run: |
          mkdir -p dist

          cp kernel/out/arch/arm64/boot/Image \
            dist/Image

          cp kernel/out/arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb \
            dist/sm7150-xiaomi-sweet.dtb

          echo "===== FINAL ARTIFACTS ====="
          ls -lh dist/

          echo "===== SHA256 ====="
          sha256sum dist/*

      - name: Upload Native UBports First Image
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE-UBPORT-SWEET-First-Image-DTB
          path: dist/*
          if-no-files-found: error
          retention-days: 14
