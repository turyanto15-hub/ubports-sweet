
name: Sweet Kernel Build Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: techyminati/android_kernel_xiaomi_sweet
          ref: android-11.0
          path: kernel
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            libssl-dev libelf-dev libncurses-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            python3

      - name: Verify source and compiler
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel

          make kernelversion
          aarch64-linux-gnu-gcc --version

          test -f arch/arm64/configs/vendor/sweet_user_defconfig

      - name: Generate configuration
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel

          mkdir -p "$GITHUB_WORKSPACE/out"

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/sweet_user_defconfig

          test -s "$GITHUB_WORKSPACE/out/.config"

      - name: Compile kernel
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel

          make -j2 O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz dtbs

      - name: Verify build outputs
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          test -s out/arch/arm64/boot/Image.gz

          echo "=== Image.gz ==="
          ls -lh out/arch/arm64/boot/Image.gz

          echo "=== Device tree files ==="
          find out/arch/arm64/boot/dts \
            -type f -name '*.dtb' -print

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-kernel-build-test
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn
