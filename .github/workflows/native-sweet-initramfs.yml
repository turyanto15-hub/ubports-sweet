name: Native UBports Sweet Diagnostic Initramfs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-sweet-initramfs
  cancel-in-progress: true

jobs:
  build-initramfs:
    name: Build ARM64 Diagnostic Initramfs
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            wget bzip2 make cpio gzip file zip \
            qemu-user

      - name: Build static ARM64 BusyBox
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"
          wget -q https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar -xjf busybox-1.36.1.tar.bz2
          cd busybox-1.36.1

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig

          sed -i \
            -e 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' \
            -e 's/^CONFIG_TC=y/# CONFIG_TC is not set/' \
            .config

          grep -q '^CONFIG_STATIC=y$' .config

          echo "===== BUSYBOX CONFIG ====="
          grep -E 'CONFIG_STATIC=|CONFIG_TC=' .config || true

          echo "===== BUILD BUSYBOX ====="
          make -j2 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

          test -s busybox
          file busybox

          aarch64-linux-gnu-readelf -h busybox | grep -q AArch64

          if aarch64-linux-gnu-readelf -l busybox | grep -q INTERP; then
            echo "::error::BusyBox is not statically linked"
            exit 1
          fi

          APPLETS="sh mount mkdir mknod sleep setsid cttyhack cat uname dmesg ls grep tail head wc ps readlink true false"

          qemu-aarch64 ./busybox --list > "$RUNNER_TEMP/busybox-applets.txt"

          for applet in $APPLETS; do
            grep -qx "$applet" "$RUNNER_TEMP/busybox-applets.txt" || {
              echo "::error::Missing BusyBox applet: $applet"
              exit 1
            }
          done

          mkdir -p "$GITHUB_WORKSPACE/output"
          install -m 0755 busybox "$GITHUB_WORKSPACE/output/busybox-arm64"

          printf '%s\n' $APPLETS > "$GITHUB_WORKSPACE/output/applets.txt"

      - name: Create diagnostic initramfs
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/output"
          ROOT="$OUT/initramfs-root"

          mkdir -p "$ROOT"/{bin,dev,proc,sys,run,tmp,root,etc}

          install -m 0755 "$OUT/busybox-arm64" "$ROOT/bin/busybox"

          APPLETS="sh mount mkdir mknod sleep setsid cttyhack cat uname dmesg ls grep tail head wc ps readlink true false"

          for applet in $APPLETS; do
            ln -sf busybox "$ROOT/bin/$applet"
          done

          sudo mknod -m 600 "$ROOT/dev/console" c 5 1
          sudo mknod -m 666 "$ROOT/dev/null" c 1 3
          sudo chown root:root "$ROOT/dev/console" "$ROOT/dev/null"

          cat > "$ROOT/init" <<'INIT'
          #!/bin/sh

          export PATH=/bin:/sbin:/usr/bin:/usr/sbin

          mount -t proc proc /proc 2>/dev/null || true
          mount -t sysfs sysfs /sys 2>/dev/null || true
          mount -t devtmpfs devtmpfs /dev 2>/dev/null || true

          mkdir -p /dev/pts /run /tmp
          mount -t devpts devpts /dev/pts 2>/dev/null || true

          if [ ! -c /dev/console ]; then
            mknod -m 600 /dev/console c 5 1 2>/dev/null || true
          fi

          if [ ! -c /dev/null ]; then
            mknod -m 666 /dev/null c 1 3 2>/dev/null || true
          fi

          if [ -c /dev/console ]; then
            exec </dev/console >/dev/console 2>&1
          fi

          echo
          echo "========================================"
          echo " NATIVE UBPORTS SWEET DIAGNOSTIC INIT"
          echo "========================================"

          echo
          echo "===== KERNEL INFORMATION ====="
          uname -a

          echo
          echo "===== KERNEL COMMAND LINE ====="
          cat /proc/cmdline 2>/dev/null || true

          echo
          echo "===== CPU INFORMATION ====="
          cat /proc/cpuinfo 2>/dev/null || true

          echo
          echo "===== MEMORY ====="
          cat /proc/meminfo 2>/dev/null || true

          echo
          echo "===== PARTITIONS ====="
          cat /proc/partitions 2>/dev/null || true

          echo
          echo "===== BLOCK DEVICES ====="
          ls -l /sys/class/block 2>/dev/null || true

          echo
          echo "===== DEVICE TREE ====="
          ls -l /sys/firmware/devicetree/base 2>/dev/null || true

          echo
          echo "===== KERNEL LOG ====="
          dmesg 2>/dev/null | tail -n 80 || true

          echo
          echo "========================================"
          echo " DIAGNOSTIC SHELL READY"
          echo "========================================"

          exec setsid cttyhack sh
          INIT

          chmod 0755 "$ROOT/init"

          sudo sh -c 'cd "$1" && find . -print0 | cpio --null -o --format=newc' \
            _ "$ROOT" > "$OUT/initramfs.cpio"

          gzip -n -9 -c "$OUT/initramfs.cpio" > "$OUT/initramfs.cpio.gz"

          test -s "$OUT/initramfs.cpio"
          test -s "$OUT/initramfs.cpio.gz"

      - name: Validate initramfs
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/output"
          VERIFY="$OUT/verify"

          gzip -t "$OUT/initramfs.cpio.gz"
          mkdir -p "$VERIFY"

          gzip -dc "$OUT/initramfs.cpio.gz" \
            | sudo sh -c 'cd "$1" && cpio -idm --quiet' _ "$VERIFY"

          test -x "$VERIFY/init"
          test -x "$VERIFY/bin/busybox"
          test -c "$VERIFY/dev/console"
          test -c "$VERIFY/dev/null"

          aarch64-linux-gnu-readelf -h "$VERIFY/bin/busybox" \
            | grep -q AArch64

          if aarch64-linux-gnu-readelf -l "$VERIFY/bin/busybox" | grep -q INTERP; then
            echo "::error::BusyBox requires a dynamic linker"
            exit 1
          fi

          APPLETS="sh mount mkdir mknod sleep setsid cttyhack cat uname dmesg ls grep tail head wc ps readlink true false"

          for applet in $APPLETS; do
            test -L "$VERIFY/bin/$applet"
            test -e "$VERIFY/bin/$applet"
          done

          echo "===== INITRAMFS CONTENTS ====="
          find "$VERIFY" -maxdepth 2 -print | sort

          echo "SUCCESS: ARM64 STATIC DIAGNOSTIC INITRAMFS VALIDATED"

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/output"
          cd "$OUT"

          sha256sum \
            busybox-arm64 \
            initramfs.cpio \
            initramfs.cpio.gz \
            applets.txt > SHA256SUMS

          cat > manifest.txt <<'EOF'
          Project: Native UBports Sweet
          Device: Xiaomi Redmi Note 10 Pro
          Codename: sweet
          SoC: Qualcomm SM7150
          Architecture: ARM64
          BusyBox: 1.36.1 static
          Initramfs: Diagnostic early userspace
          Format: cpio newc + gzip
          Root filesystem: Not included
          Ubuntu Touch userspace: Not included
          Purpose: Kernel and early userspace diagnostic
          EOF

          zip -9 NATIVE-UBPORT-SWEET-Diagnostic-Initramfs-ARM64.zip \
            busybox-arm64 \
            initramfs.cpio \
            initramfs.cpio.gz \
            applets.txt \
            SHA256SUMS \
            manifest.txt

          echo "===== ARTIFACT ====="
          ls -lh NATIVE-UBPORT-SWEET-Diagnostic-Initramfs-ARM64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE-UBPORT-SWEET-Diagnostic-Initramfs-ARM64
          path: output/NATIVE-UBPORT-SWEET-Diagnostic-Initramfs-ARM64.zip
          if-no-files-found: error
          retention-days: 30
