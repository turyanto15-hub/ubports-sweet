
name: Native UBports Sweet Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ubports-sweet
  cancel-in-progress: true

jobs:
  build:
    name: Build Native Linux for Redmi Note 10 Pro
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      JOBS: 2
      SOURCE_REPO: turyanto15-hub/linux-native
      SOURCE_BRANCH: sweet-dsc-slice-per-pkt
      EXPECTED_COMMIT: 477b07522c115b2523e1d8a8f784e93b11a3054f

    steps:
      - name: Checkout patched native kernel
        uses: actions/checkout@v4
        with:
          repository: turyanto15-hub/linux-native
          ref: 477b07522c115b2523e1d8a8f784e93b11a3054f
          path: kernel
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio \
            device-tree-compiler dwarves file flex \
            gcc-aarch64-linux-gnu git libelf-dev \
            libncurses-dev libssl-dev lz4 make \
            python3 rsync unzip zip

          echo "===== GCC ====="
          aarch64-linux-gnu-gcc --version | head -1
          echo "===== DTC ====="
          dtc --version

      - name: Verify kernel source and DSC patch
        working-directory: kernel
        run: |
          set -euo pipefail

          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          echo "Expected: $EXPECTED_COMMIT"
          echo "Actual:   $ACTUAL_COMMIT"
          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"

          echo "===== SOURCE VALIDATION ====="
          test -s arch/arm64/configs/sm7150.config
          test -s arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dts
          test -s drivers/input/touchscreen/goodix_gtx8.c
          test -s drivers/gpu/drm/panel/panel-samsung-ams667yr01.c

          echo "===== DSC PACKET SUPPORT ====="
          grep -n "slice_per_pkt" \
            drivers/gpu/drm/msm/dsi/dsi_host.c
          grep -n "slice_per_pkt = 2" \
            drivers/gpu/drm/panel/panel-samsung-ams667yr01.c

          echo "===== KERNEL VERSION ====="
          make kernelversion

          echo "SOURCE AND DSC VALIDATION: PASS"

      - name: Initialize ARM64 defconfig
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p out

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            defconfig

          test -s out/.config
          echo "BASE DEFCONFIG: PASS"

      - name: Merge SM7150 configuration
        working-directory: kernel
        run: |
          set -euo pipefail

          bash scripts/kconfig/merge_config.sh \
            -m \
            -O out \
            out/.config \
            arch/arm64/configs/sm7150.config

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          test -s out/.config
          echo "SM7150 CONFIGURATION MERGE: PASS"

      - name: Configure Sweet hardware and ARM64 memory
        working-directory: kernel
        run: |
          set -euo pipefail

          scripts/config --file out/.config \
            --enable ARM64_4K_PAGES \
            --disable ARM64_16K_PAGES \
            --disable ARM64_64K_PAGES \
            --enable ARM64_VA_BITS_39 \
            --disable ARM64_VA_BITS_48 \
            --disable ARM64_VA_BITS_52 \
            --enable ARM64_PA_BITS_48 \
            --disable ARM64_PA_BITS_52 \
            --enable I2C \
            --enable OF \
            --enable GPIOLIB \
            --enable REGULATOR \
            --enable INPUT \
            --enable DRM \
            --enable DRM_MSM \
            --enable DRM_MIPI_DSI \
            --enable BACKLIGHT_CLASS_DEVICE \
            --enable TOUCHSCREEN_GOODIX_GTX8 \
            --enable DRM_PANEL_SAMSUNG_AMS667YR01

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "===== ARM64 CONFIGURATION ====="
          grep -E \
            '^(CONFIG_ARM64_(4K_PAGES|16K_PAGES|64K_PAGES|VA_BITS_39|VA_BITS_48|VA_BITS_52|PA_BITS_48|PA_BITS_52|VA_BITS|PA_BITS))=' \
            out/.config || true

          echo "===== SWEET DRIVER CONFIGURATION ====="
          grep -E \
            '^(CONFIG_DRM_MSM|CONFIG_DRM_MIPI_DSI|CONFIG_DRM_PANEL_SAMSUNG_AMS667YR01|CONFIG_TOUCHSCREEN_GOODIX_GTX8|CONFIG_BACKLIGHT_CLASS_DEVICE)=' \
            out/.config || true

          echo "===== VALIDATION ====="
          grep -q '^CONFIG_ARM64_4K_PAGES=y$' out/.config
          grep -q '^CONFIG_ARM64_VA_BITS_39=y$' out/.config
          grep -q '^CONFIG_ARM64_PA_BITS_48=y$' out/.config

          grep -q '^CONFIG_DRM_MSM=y$' out/.config
          grep -q '^CONFIG_DRM_MIPI_DSI=y$' out/.config
          grep -q '^CONFIG_DRM_PANEL_SAMSUNG_AMS667YR01=y$' out/.config
          grep -q '^CONFIG_TOUCHSCREEN_GOODIX_GTX8=y$' out/.config
          grep -q '^CONFIG_BACKLIGHT_CLASS_DEVICE=y$' out/.config

          if grep -q '^CONFIG_ARM64_LPA2=y$' out/.config; then
            echo "ERROR: LPA2 unexpectedly enabled"
            exit 1
          fi

          echo "ARM64 AND SWEET CONFIGURATION: PASS"

      - name: Build Native Image and Sweet DTB
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "===== BUILD INFORMATION ====="
          echo "Repository: $SOURCE_REPO"
          echo "Branch label: $SOURCE_BRANCH"
          echo "Commit: $EXPECTED_COMMIT"
          echo "Architecture: $ARCH"
          echo "Compiler: $CROSS_COMPILE"
          echo "Jobs: $JOBS"

          echo "===== BUILD START ====="

          make -j"$JOBS" O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image \
            qcom/sm7150-xiaomi-sweet.dtb \
            2>&1 | tee build.log

          echo "NATIVE KERNEL BUILD: PASS"

      - name: Verify and package build outputs
        working-directory: kernel
        run: |
          set -euo pipefail

          IMAGE="out/arch/arm64/boot/Image"
          DTB="out/arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb"

          echo "===== VERIFY IMAGE ====="
          test -s "$IMAGE"
          file "$IMAGE"
          ls -lh "$IMAGE"

          echo "===== VERIFY SWEET DTB ====="
          test -s "$DTB"
          file "$DTB"
          ls -lh "$DTB"

          echo "===== VERIFY SYSTEM MAP ====="
          test -s out/System.map

          echo "===== VERIFY CONFIG ====="
          test -s out/.config

          echo "===== VERIFY BUILD LOG ====="
          test -s build.log

          PACKAGE="NATIVE-UBPORT-SWEET-IMAGE"
          mkdir -p "$PACKAGE/dtbs"

          cp "$IMAGE" "$PACKAGE/Image"
          cp "$DTB" "$PACKAGE/dtbs/sm7150-xiaomi-sweet.dtb"
          cp out/System.map "$PACKAGE/System.map"
          cp out/.config "$PACKAGE/kernel.config"
          cp build.log "$PACKAGE/kernel-build.log"

          {
            echo "Device: Xiaomi Redmi Note 10 Pro"
            echo "Codename: sweet"
            echo "SoC: Qualcomm SM7150"
            echo "Architecture: ARM64"
            echo "Kernel version: $(make kernelversion)"
            echo "Repository: $SOURCE_REPO"
            echo "Branch label: $SOURCE_BRANCH"
            echo "Source commit: $EXPECTED_COMMIT"
            echo "Compiler: $(aarch64-linux-gnu-gcc --version | head -1)"
            echo "Build date UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Build targets: Image, Sweet DTB"
            echo "Page size: 4K"
            echo "Virtual address: 39-bit"
            echo "LPA2: disabled"
            echo "DSC slice_per_pkt: 2"
            echo "Artifact purpose: Native UBports kernel build audit"
          } > "$PACKAGE/manifest.txt"

          (
            cd "$PACKAGE"
            sha256sum \
              Image \
              System.map \
              kernel.config \
              kernel-build.log \
              dtbs/sm7150-xiaomi-sweet.dtb \
              > SHA256SUMS
          )

          zip -r NATIVE-UBPORT-SWEET-IMAGE.zip "$PACKAGE"

          echo "===== FINAL ARTIFACT ====="
          ls -lh NATIVE-UBPORT-SWEET-IMAGE.zip
          sha256sum NATIVE-UBPORT-SWEET-IMAGE.zip

          echo "PACKAGE CREATION: PASS"

      - name: Upload Native Sweet artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE-UBPORT-SWEET-IMAGE-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            kernel/NATIVE-UBPORT-SWEET-IMAGE.zip
            kernel/build.log
            kernel/out/.config
            kernel/out/System.map
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dts/qcom/sm7150-xiaomi-sweet.dtb
