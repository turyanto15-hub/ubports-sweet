
name: Audit UBports Sweet Source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "kernel/**"
      - "device/**"
      - "vendor/**"

permissions:
  contents: read

jobs:
  audit:
    name: Audit source kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Audit struktur repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=== UBports Sweet Source Audit ==="
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Repository: $(git rev-parse --show-toplevel)"

          echo ""
          echo "=== Struktur repository ==="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            | sort | head -200

          echo ""
          echo "=== Pemeriksaan source kernel ==="

          if [ -f Makefile ] && [ -d arch/arm64/configs ]; then
            echo "Source kernel terdeteksi."

            grep -E \
              '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
              Makefile || true

            echo ""
            echo "=== Kandidat defconfig sweet ==="

            find arch/arm64/configs -type f \
              -iname '*sweet*defconfig' -print
          else
            echo "::warning::Source kernel belum tersedia di root repository."
            echo "Audit struktur selesai, tetapi kernel belum divalidasi."
          fi

          echo ""
          echo "=== Audit selesai ==="
