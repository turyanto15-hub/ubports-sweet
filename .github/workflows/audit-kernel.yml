name: UBports Kernel Audit - sweet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit Redmi Note 10 Pro
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y git

      - name: Clone kernel source
        shell: bash
        run: |
          set -eu
          git clone --depth=1 --branch android-11.0 --single-branch https://github.com/techyminati/android_kernel_xiaomi_sweet.git kernel
          git -C kernel log -1 --format='%H%n%s'

      - name: Audit kernel version
        shell: bash
        run: |
          set -eu
          test -f kernel/Makefile
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' kernel/Makefile

      - name: Audit defconfig
        shell: bash
        run: |
          set -eu
          find kernel/arch/arm64/configs -type f -iname '*sweet*defconfig' -print

      - name: Save audit report
        if: always()
        shell: bash
        run: |
          {
            echo "Device: Redmi Note 10 Pro"
            echo "Codename: sweet"
            echo "Target: UBports / Ubuntu Touch"
            echo "Build performed: No"
            echo "Compatibility: Not verified"
          } > audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubports-sweet-audit-report
          path: audit-report.txt
