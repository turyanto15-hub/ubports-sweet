name: UBports Kernel Audit - sweet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
   name: Audit Redmi Note 10 Pro
   runs-on: ubuntu-22.04
  timeout-minutes: 20

  steps:
    - name: Checkout workflow repository
      uses: actions/checkout@v4

    - name: Install tools
      shell: bash

      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y git

    - name: Clone kernel source
      shell: bash
      run: |
        set -eu
        git clone \
        --branch android-11.0 \
        --single-branch \
        https://github.com/techyminati/android_kernel_xiaomi_sweet.git \
        kernel

        echo "=== Kernel commit ==="
        git -C kernel log -1 --format="%H%n%s"

        - name: Audit kernel version
        shell: bash
      brun: |
       set -eu
       test -f kernel/Makefile
 
       VERSION=$(sed -n 's/^VERSION = //p' kernel/Makefile)
       PATCHLEVEL=$(sed -n 's/^PATCHLEVEL = //p' kernel/Makefile)
       SUBLEVEL=$(sed -n 's/^SUBLEVEL = //p' kernel/Makefile)

      echo "Detected: ${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

    - name: Audit defconfig and device tree
      shell: bash
      run: |
       set -eu

       echo "=== Sweet defconfig candidates ==="
       if [ -d kernel/arch/arm64/configs ]; then
        find kernel/arch/arm64/configs \
          -type f -iname '*sweet*defconfig' -print
       else
        echo "::warning::Direktori konfigurasi ARM64 tidak ditemukan."
       fi

       echo "=== Build configuration ==="
       for file in \
        kernel/build.config.aarch64 \
        kernel/build.config.common \
        kernel/AndroidKernel.mk
       do
        if [ -f "$file" ]; then
          echo "--- $file ---"
          sed -n '1,80p' "$file"
        fi
       done

       echo "=== Device tree candidates ==="
       if [ -d kernel/arch/arm64/boot/dts ]; then
        find kernel/arch/arm64/boot/dts \
          -type f \
          | grep -Ei 'sweet|atoll|sm6150|qcom' \
          | sed -n '1,100p' || true
       else
        echo "Device tree tidak ditemukan pada lokasi standar."
       fi

    - name: Save audit report
    if: always()
    shell: bash
    run: |
      {
        echo "UBports kernel audit"
        echo "Device: Redmi Note 10 Pro"
        echo "Codename: sweet"
        echo "Target: UBports / Ubuntu Touch"
        echo "Source: techyminati/android_kernel_xiaomi_sweet"
        echo "Branch: android-11.0"
        echo "Build performed: No"
        echo "UBports compatibility: Not verified"
      } > audit-report.txt
      - name: Upload audit report
       if: always()
       uses: actions/upload-artifact@v4
       with:
      name: ubports-sweet-audit-report
      path: audit-report.txt
