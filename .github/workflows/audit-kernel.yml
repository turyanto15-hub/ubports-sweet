name: Audit UBports Sweet Source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "kernel/**"
      - "device/**"
      - "vendor/**"

permissions:
  contents: read

jobs:
  audit:
    name: Audit source kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Periksa struktur source
        shell: bash
        run: |
          set -euo pipefail

          echo "=== UBports Sweet Source Audit ==="
          echo "Commit: $(git rev-parse --short HEAD)"

          if [ ! -f Makefile ]; then
            echo "::error::Makefile kernel tidak ditemukan."
            echo "Repository ini belum berisi root source kernel."
            exit 1
          fi

          if [ ! -d arch/arm64/configs ]; then
            echo "::error::Konfigurasi ARM64 tidak ditemukan."
            exit 1
          fi

          echo "=== Versi kernel ==="
          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile || true

          echo "=== Kandidat defconfig sweet ==="
          find arch/arm64/configs -type f \
            -iname '*sweet*defconfig' -print

          echo "=== Audit selesai ==="
