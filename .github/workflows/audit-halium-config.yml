name: Check Kernel Config for Halium

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-config:
    name: Check Kernel Config for Halium
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev

      - name: Clone kernel source
        run: |
          set -eu
          git clone --depth=1 \
            --branch android-11.0 \
            https://github.com/techyminati/android_kernel_xiaomi_sweet.git \
            kernel

      - name: Verify defconfig exists
        shell: bash
        run: |
          set -eu
          cd kernel

          echo "=== Kernel version ==="
          make kernelversion

          echo
          echo "=== Available sweet defconfigs ==="
          find arch/arm64/configs -type f \
            \( -iname '*sweet*' -o -iname '*atoll*' \) \
            -print

          DEFCONFIG="arch/arm64/configs/vendor/sweet_user_defconfig"

          if [ ! -f "$DEFCONFIG" ]; then
            echo "ERROR: Defconfig tidak ditemukan: $DEFCONFIG"
            exit 1
          fi

          echo "PASS: $DEFCONFIG ditemukan"

      - name: Generate kernel configuration
        shell: bash
        run: |
          set -eu
          cd kernel

          mkdir -p "$GITHUB_WORKSPACE/out"

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            vendor/sweet_user_defconfig \
            2>&1 | tee "$GITHUB_WORKSPACE/config-build.log"

          test -s "$GITHUB_WORKSPACE/out/.config"

          echo "PASS: .config berhasil dibuat"

      - name: Check Halium options
        if: always()
        shell: bash
        run: |
          CONFIG="$GITHUB_WORKSPACE/out/.config"

          if [ ! -s "$CONFIG" ]; then
            echo "ERROR: .config belum tersedia."
            echo "Periksa log langkah Generate kernel configuration."
            exit 1
          fi

          echo "=== Kernel config: Halium checks ==="

          for option in \
            CONFIG_DEVTMPFS \
            CONFIG_FHANDLE \
            CONFIG_SYSVIPC \
            CONFIG_IPC_NS \
            CONFIG_NET_NS \
            CONFIG_PID_NS \
            CONFIG_USER_NS \
            CONFIG_UTS_NS \
            CONFIG_VT
          do
            if grep -qx "${option}=y" "$CONFIG"; then
              echo "PASS: ${option}=y"
            elif grep -qx "# ${option} is not set" "$CONFIG"; then
              echo "CHECK: ${option} disabled"
            else
              echo "CHECK: ${option} missing or not enabled"
            fi
          done

          echo
          echo "=== Kernel config version ==="
          grep -E '^(CONFIG_LOCALVERSION=|CONFIG_ARCH=|CONFIG_ARM64=)' \
            "$CONFIG" || true

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-halium-config-audit
          path: |
            config-build.log
            out/.config
          if-no-files-found: warn
