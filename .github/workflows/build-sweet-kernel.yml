
name: Sweet Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sweet-kernel-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Redmi Note 10 Pro Sweet Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      KERNEL_REPO: turyanto15-hub/android_kernel_xiaomi_sm6150
      KERNEL_BRANCH: lineage-20
      CLANG_DIR: /tmp/toolchains/clang
      JOBS: 2

    steps:
      # 1. Checkout source kernel dari fork milik sendiri
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: turyanto15-hub/android_kernel_xiaomi_sm6150
          ref: lineage-20
          path: kernel
          fetch-depth: 1

      # 2. Install dependency dan GCC cross compiler
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            zip \
            device-tree-compiler

          echo "===== GCC VERSION ====="
          aarch64-linux-gnu-gcc --version | head -1

      # 3. Download Clang r383902
      - name: Download Clang r383902
        run: |
          set -e

          mkdir -p "$CLANG_DIR"

          curl -fL \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" \
            -o "$RUNNER_TEMP/clang.tar.gz"

          tar -xzf "$RUNNER_TEMP/clang.tar.gz" -C "$CLANG_DIR"

          # PATH untuk step sekarang dan step berikutnya
          export PATH="$CLANG_DIR/bin:$PATH"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

          export LD_LIBRARY_PATH="$CLANG_DIR/lib64:${LD_LIBRARY_PATH:-}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

          echo "===== CLANG LOCATION ====="
          command -v clang

          echo "===== CLANG VERSION ====="
          clang --version

          echo "===== LLD LOCATION ====="
          command -v ld.lld

          echo "===== LLD VERSION ====="
          ld.lld --version

          # Pastikan compiler berasal dari toolchain yang diunduh
          test "$(command -v clang)" = "$CLANG_DIR/bin/clang"
          test "$(command -v ld.lld)" = "$CLANG_DIR/bin/ld.lld"

      # 4. Periksa seluruh toolchain
      - name: Verify build toolchain
        run: |
          set -e

          echo "===== CLANG ====="
          clang --version

          echo "===== LLD ====="
          ld.lld --version

          echo "===== GCC CROSS COMPILER ====="
          aarch64-linux-gnu-gcc --version | head -1

          echo "===== GCC BINUTILS ====="
          aarch64-linux-gnu-ld --version | head -1

          echo "===== DTC ====="
          dtc --version

      # 5. Periksa identitas source
      - name: Verify kernel source
        working-directory: kernel
        run: |
          set -e

          echo "===== REPOSITORY ====="
          git remote -v

          echo "===== BRANCH ====="
          git branch --show-current

          echo "===== COMMIT ====="
          git log -1 --oneline

          echo "===== KERNEL VERSION ====="
          make kernelversion

      # 6. Membuat konfigurasi dasar
      - name: Initialize kernel configuration
        working-directory: kernel
        run: |
          set -e

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC=clang \
            LD=ld.lld \
            vendor/atoll-perf_defconfig

      # 7. Menggabungkan konfigurasi Sweet
      - name: Merge Sweet configuration
        working-directory: kernel/out
        run: |
          set -e

          bash ../scripts/kconfig/merge_config.sh \
            -m \
            .config \
            ../arch/arm64/configs/vendor/sweet.config

      # 8. Finalisasi konfigurasi
      - name: Finalize kernel configuration
        working-directory: kernel
        run: |
          set -e

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC=clang \
            LD=ld.lld \
            olddefconfig

          echo "===== SWEET CONFIGURATION ====="

          grep -E \
            '^(CONFIG_ARCH_QCOM|CONFIG_ARCH_ATOLL|CONFIG_ARCH_SDMMAGPIE|CONFIG_MACH_XIAOMI_SWEET|CONFIG_NFC_NQ_PN80T|CONFIG_BQ2597X_CHARGE_PUMP|CONFIG_LDO_WL2866D|CONFIG_INPUT_FINGERPRINT)=' \
            out/.config

          grep -q '^CONFIG_ARCH_SDMMAGPIE=y' out/.config
          grep -q '^CONFIG_MACH_XIAOMI_SWEET=y' out/.config

      # 9. Build Image.gz, DTB dan DTBO
      - name: Build kernel and device trees
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "===== BUILD START ====="
          echo "JOBS: $JOBS"

          make -j"$JOBS" O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz dtbs 2>&1 | tee build.log

          echo "===== BUILD FINISHED ====="

      # 10. Verifikasi hasil build
      - name: Verify build outputs
        working-directory: kernel
        run: |
          set -e

          echo "===== IMAGE GZ ====="

          test -s out/arch/arm64/boot/Image.gz
          ls -lh out/arch/arm64/boot/Image.gz

          echo "===== SWEET DTBO ====="

          test -s out/arch/arm64/boot/dts/qcom/sweet-sdmmagpie-overlay.dtbo
          ls -lh out/arch/arm64/boot/dts/qcom/sweet-sdmmagpie-overlay.dtbo

          echo "===== GENERATED DTB / DTBO ====="

          find out/arch/arm64/boot/dts/qcom \
            -type f \( -name '*.dtb' -o -name '*.dtbo' \) \
            -print

          DTB_COUNT=$(find out/arch/arm64/boot/dts/qcom -type f -name '*.dtb' | wc -l)
          DTBO_COUNT=$(find out/arch/arm64/boot/dts/qcom -type f -name '*.dtbo' | wc -l)

          echo "DTB count: $DTB_COUNT"
          echo "DTBO count: $DTBO_COUNT"

          test "$DTB_COUNT" -gt 0
          test "$DTBO_COUNT" -gt 0

      # 11. Upload artifact dan log
      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-kernel-build
          if-no-files-found: warn
          path: |
            kernel/build.log
            kernel/out/.config
            kernel/out/System.map
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/dts/qcom/*.dtb
            kernel/out/arch/arm64/boot/dts/qcom/*.dtbo
