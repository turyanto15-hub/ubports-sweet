
name: Sweet - Halium 11 Kernel and Boot Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sweet-halium11-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Redmi Note 10 Pro
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            device-tree-compiler \
            fakeroot \
            flex \
            git \
            gperf \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            lz4 \
            python2.7 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python2

      - name: Clone Sweet Halium 11 port
        run: |
          git clone --depth=1 \
            --branch halium-11.0 \
            https://gitlab.com/ubports-sweet/xiaomi-sweet.git \
            port

      - name: Verify port build script
        run: |
          cd port

          echo "===== PORT DIRECTORY ====="
          pwd
          ls -lah

          echo "===== BUILD SCRIPT ====="
          test -f build.sh || {
            echo "ERROR: build.sh tidak ditemukan"
            exit 1
          }

          chmod +x build.sh
          sed -n '1,80p' build.sh

      - name: Configure deviceinfo
        run: |
          cd port

          cat > deviceinfo <<'EOF'
          deviceinfo_name="Xiaomi Redmi Note 10 Pro"
          deviceinfo_manufacturer="Xiaomi"
          deviceinfo_codename="sweet"
          deviceinfo_arch="aarch64"

          deviceinfo_kernel_source="https://gitlab.com/ubports-sweet/kernel-xiaomi-sweet.git"
          deviceinfo_kernel_source_branch="halium-11.0"
          deviceinfo_kernel_defconfig="vendor/sweet-perf_defconfig"

          deviceinfo_kernel_cmdline="androidboot.selinux=permissive console=ttyMSM0,115200n8 androidboot.hardware=qcom androidboot.console=ttyMSM0 androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 swiotlb=1 androidboot.usbcontroller=a600000.dwc3 earlycon=msm_geni_serial,0x880000 loop.max_part=7 console=tty0 androidboot.init_fatal_reboot_target=recovery kpti=off"

          deviceinfo_kernel_clang_compile="true"
          deviceinfo_kernel_use_dtc_ext="true"
          deviceinfo_halium_version="11"

          deviceinfo_dtb="qcom/sdmmagpie.dtb"
          deviceinfo_dtbo="qcom/sweet-sdmmagpie-overlay.dtbo"

          deviceinfo_flash_pagesize="4096"
          deviceinfo_flash_offset_base="0x00000000"
          deviceinfo_flash_offset_kernel="0x00008000"
          deviceinfo_flash_offset_ramdisk="0x01000000"
          deviceinfo_flash_offset_second="0x00000000"
          deviceinfo_flash_offset_tags="0x0000100"
          deviceinfo_flash_offset_dtb="0x01f00000"

          deviceinfo_bootimg_qcdt="false"
          deviceinfo_bootimg_header_version="2"
          deviceinfo_bootimg_os_version="11"
          deviceinfo_bootimg_os_patch_level="2021-10-01"
          deviceinfo_bootimg_partition_size="134217728"
          deviceinfo_recovery_partition_size="134217728"
          deviceinfo_rootfs_image_sector_size="4096"
          EOF

          echo "===== DEVICEINFO ====="
          cat deviceinfo

      - name: Install AOSP mkbootimg
        run: |
          echo "===== CLONE LINEAGEOS MKBOOTIMG ====="

          git clone --depth=1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_system_tools_mkbootimg.git \
            "$RUNNER_TEMP/android-mkbootimg"

          test -s "$RUNNER_TEMP/android-mkbootimg/mkbootimg.py"

          echo "===== CREATE MKBOOTIMG COMMAND ====="

          sudo tee /usr/local/bin/mkbootimg >/dev/null <<EOF
          #!/usr/bin/env bash
          exec python3 "${RUNNER_TEMP}/android-mkbootimg/mkbootimg.py" "\$@"
          EOF

          sudo chmod +x /usr/local/bin/mkbootimg

          echo "===== VERIFY MKBOOTIMG ====="
          command -v mkbootimg
          mkbootimg --help >/dev/null
          echo "mkbootimg is ready"

      - name: Prepare output directories
        run: |
          mkdir -p port/workdir
          mkdir -p port/out
      - name: Inspect Halium build options
        run: |
          cd port
          if [ ! -d build ]; then
            git clone --depth=1 \
              --branch halium-11 \
              https://gitlab.com/ubports/community-ports/halium-generic-adaptation-build-tools.git \
              build
          fi

          echo "===== BUILD HELP ====="
          bash build/build.sh --help || true

          echo "===== BUILD SCRIPT OPTIONS ====="
          grep -nE 'getopts|case |BUILD_DIR|OUT=|unknown option|while ' build/build.sh || true
      - name: Build kernel, DTB, DTBO and boot image
        run: |
          cd port

          echo "===== CHECK MKBOOTIMG ====="
          command -v mkbootimg
          mkbootimg --help >/dev/null

          echo "===== START HALIUM 11 BUILD ====="
          ./build.sh -b workdir -o out -k

      - name: Verify build outputs
        if: success()
        run: |
          cd port

          echo "===== BOOT IMAGE ====="
          test -s workdir/tmp/partitions/boot.img
          ls -lh workdir/tmp/partitions/boot.img

          echo "===== DTBO IMAGE ====="
          test -s workdir/tmp/partitions/dtbo.img
          ls -lh workdir/tmp/partitions/dtbo.img

          echo "===== KERNEL IMAGE ====="
          test -s workdir/downloads/KERNEL_OBJ/arch/arm64/boot/Image.gz
          ls -lh workdir/downloads/KERNEL_OBJ/arch/arm64/boot/Image.gz

          echo "===== DEVICE TREE ====="
          test -s workdir/downloads/KERNEL_OBJ/arch/arm64/boot/dts/qcom/sdmmagpie.dtb
          test -s workdir/downloads/KERNEL_OBJ/arch/arm64/boot/dts/qcom/sweet-sdmmagpie-overlay.dtbo

          ls -lh workdir/downloads/KERNEL_OBJ/arch/arm64/boot/dts/qcom/sdmmagpie.dtb
          ls -lh workdir/downloads/KERNEL_OBJ/arch/arm64/boot/dts/qcom/sweet-sdmmagpie-overlay.dtbo

          echo "===== KERNEL CONFIG ====="
          test -s workdir/downloads/KERNEL_OBJ/.config
          ls -lh workdir/downloads/KERNEL_OBJ/.config

          echo "===== BUILD OUTPUT VERIFICATION PASSED ====="

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-halium11-kernel-boot
          if-no-files-found: warn
          retention-days: 7
          path: |
            port/workdir/tmp/partitions/boot.img
            port/workdir/tmp/partitions/dtbo.img
            port/workdir/downloads/KERNEL_OBJ/.config
            port/workdir/downloads/KERNEL_OBJ/arch/arm64/boot/Image.gz
            port/workdir/downloads/KERNEL_OBJ/arch/arm64/boot/dts/qcom/sdmmagpie.dtb
            port/workdir/downloads/KERNEL_OBJ/arch/arm64/boot/dts/qcom/sweet-sdmmagpie-overlay.dtbo
