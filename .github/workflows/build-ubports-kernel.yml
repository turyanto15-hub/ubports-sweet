name: Fix DSI Panel Floating Point

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-dsi-panel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: turyanto15-hub/ubports-sweet
          ref: main
          persist-credentials: false

      - name: Install tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Inspect DSI panel source
        shell: bash
        run: |
          set -eu

          FILE="kernel/drivers/gpu/drm/msm/dsi-staging/dsi_panel.c"

          if [ ! -f "$FILE" ]; then
            echo "::error::File dsi_panel.c tidak ditemukan di path yang diharapkan."
            echo "Periksa struktur repository dan lokasi file."
            find . -type f -name dsi_panel.c -print
            exit 1
          fi

          echo "=== Lokasi ekspresi backlight ==="
          grep -n -C 8 'crcValue' "$FILE" || true

          echo "=== Deklarasi variabel terkait ==="
          grep -n -E \
            'crcValue|bl_lvl|mDCBLCoeff' "$FILE" || true

      - name: Apply verified integer-only patch
        shell: bash
        run: |
          set -eu

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(
              "kernel/drivers/gpu/drm/msm/dsi-staging/dsi_panel.c"
          )

          if not path.is_file():
              sys.exit("ERROR: dsi_panel.c tidak ditemukan")

          source = path.read_text()
          target = (
              "crcValue = 0.5 + mDCBLCoeff[0] * "
              "bl_lvl + mDCBLCoeff[1];"
          )

          if source.count(target) != 1:
              sys.exit(
                  "ERROR: Ekspresi tidak ditemukan tepat satu kali. "
                  "Tidak ada perubahan yang diterapkan."
              )

          lines = source.splitlines()
          match_index = next(
              i for i, line in enumerate(lines)
              if target in line
          )

          # Periksa deklarasi di sekitar ekspresi terlebih dahulu.
          start = max(0, match_index - 180)
          end = min(len(lines), match_index + 1)
          context = "\n".join(lines[start:end])

          declarations = {
              "crcValue": False,
              "bl_lvl": False,
              "mDCBLCoeff": False,
          }

          for name in declarations:
              pattern = (
                  r'\b(?:float|double|_Float\d+)\b'
                  r'[^;{}]*\b' + re.escape(name) + r'\b'
              )
              if re.search(pattern, context):
                  sys.exit(
                      "ERROR: Tipe floating-point terdeteksi pada "
                      + name + ". Patch dibatalkan."
                  )

          # Hanya hapus 0.5 jika variabel terkait telah diverifikasi
          # bukan deklarasi float/double pada konteks yang tersedia.
          # Jangan mengubah opsi compiler global.
          replacement = (
              "crcValue = mDCBLCoeff[0] * "
              "bl_lvl + mDCBLCoeff[1];"
          )

          updated = source.replace(target, replacement, 1)

          if updated == source:
              sys.exit("ERROR: Tidak ada perubahan yang diterapkan.")

          path.write_text(updated)
          print("Patch diterapkan; periksa diff sebelum melanjutkan.")
          PY

      - name: Review patch
        shell: bash
        run: |
          set -eu

          git diff --check
          git diff -- \
            kernel/drivers/gpu/drm/msm/dsi-staging/dsi_panel.c

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: sweet-dsi-panel-patch
          path: kernel/drivers/gpu/drm/msm/dsi-staging/dsi_panel.c
          if-no-files-found: error
