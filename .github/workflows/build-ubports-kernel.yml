
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: techyminati/android_kernel_xiaomi_sweet
          ref: android-11.0
          path: kernel
          persist-credentials: false

      - name: Verify kernel source
        shell: bash
        run: |
          set -euo pipefail

          test -d kernel/.git || {
            echo "::error::Kernel repository was not cloned"
            exit 1
          }

          cd kernel

          echo "Kernel repository:"
          git remote get-url origin

          echo "Kernel commit:"
          git rev-parse HEAD

          echo "Kernel branch/ref:"
          git status --short --branch

          CONFIG="arch/arm64/configs/vendor/sweet_user_defconfig"
          PANEL="drivers/gpu/drm/msm/dsi-staging/dsi_panel.c"

          test -f "$CONFIG" || {
            echo "::error::Missing defconfig: $CONFIG"
            exit 1
          }

          test -f "$PANEL" || {
            echo "::error::Missing DSI panel source: $PANEL"
            echo "Inspect the kernel tree before applying any patch."
            exit 1
          }

          echo "Defconfig and DSI source
          verified."
name: Patch DSI Panel - UBports Sweet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-dsi-panel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect and patch DSI panel
        shell: bash
        run: |
          set -euo pipefail

          FILE="kernel/drivers/gpu/drm/msm/dsi-staging/dsi_panel.c"

          if [ ! -f "$FILE" ]; then
            echo "::error::File tidak ditemukan: $FILE"
            echo "Periksa struktur repository dan lokasi source kernel."
            exit 1
          fi

          echo "=== Lokasi rumus bermasalah ==="
          grep -n -F \
            'crcValue = 0.5 + mDCBLCoeff[0] * bl_lvl + mDCBLCoeff[1];' \
            "$FILE" || true

          echo "=== Deklarasi variabel ==="
          grep -n -E \
            'crcValue|mDCBLCoeff|bl_lvl' "$FILE" || true

          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(
              "kernel/drivers/gpu/drm/msm/dsi-staging/dsi_panel.c"
          )
          source = path.read_text()

          old = (
              "crcValue = 0.5 + mDCBLCoeff[0] "
              "* bl_lvl + mDCBLCoeff[1];"
          )
          new = (
              "crcValue = mDCBLCoeff[0] "
              "* bl_lvl + mDCBLCoeff[1];"
          )

          if source.count(old) != 1:
              print(
                  "::error::Rumus target tidak ditemukan tepat satu kali. "
                  "Source tidak diubah."
              )
              sys.exit(1)

          # Cari deklarasi variabel yang didukung.
          # Jika tipe berupa typedef, macro, atau deklarasi kompleks,
          # workflow berhenti agar tidak membuat asumsi yang salah.
          lines = source.splitlines()

          names = {
              "crcValue": None,
              "bl_lvl": None,
              "mDCBLCoeff": None,
          }

          integer_types = {
              "char", "short", "int", "long",
              "signed", "unsigned", "u8", "u16",
              "u32", "u64", "s8", "s16", "s32", "s64",
          }

          float_types = {"float", "double", "long double"}

          for line in lines:
              stripped = line.strip()

              if not stripped or stripped.startswith(("//", "/*", "*")):
                  continue

              if not re.search(
                  r"\b(crcValue|bl_lvl|mDCBLCoeff)\b", stripped
              ):
                  continue

              if not re.search(r"[;=]", stripped):
                  continue

              # Abaikan baris pemakaian dalam ekspresi, bukan deklarasi.
              declaration = re.match(
                  r"^(?:(?:static|const|volatile|unsigned|signed|"
                  r"long|short)\s+)*(?P<type>"
                  r"(?:u8|u16|u32|u64|s8|s16|s32|s64|"
                  r"char|short|int|long|float|double)"
                  r"(?:\s+(?:long|int))?)\s+"
                  r"(?P<rest>[^;]+);$",
                  stripped,
              )

              if not declaration:
                  continue

              ctype = declaration.group("type").strip()
              rest = declaration.group("rest")

              for name in names:
                  if re.search(r"\b" + name + r"\b", rest):
                      names[name] = (ctype, stripped)

          missing = [name for name, value in names.items() if value is None]

          if missing:
              print(
                  "::error::Deklarasi tidak dapat diverifikasi: "
                  + ", ".join(missing)
              )
              print(
                  "Source tidak diubah. Periksa deklarasi asli, "
                  "termasuk typedef, macro, dan cakupan variabel."
              )
              sys.exit(1)

          for name, (ctype, declaration) in names.items():
              print(f"{name}: {ctype} | {declaration}")

              if ctype in float_types:
                  print(
                      f"::error::Variabel {name} menggunakan "
                      f"tipe floating-point. Patch otomatis dibatalkan."
                  )
                  sys.exit(1)

              tokens = set(ctype.split())
              if not tokens.issubset(integer_types):
                  print(
                      f"::error::Tipe {name} belum didukung "
                      f"untuk verifikasi otomatis."
                  )
                  sys.exit(1)

          # Pastikan koefisien merupakan array berindeks minimal 0 dan 1.
          if not re.search(
              r"\bmDCBLCoeff\s*\[\s*(?:2|[3-9]|[1-9][0-9]+)\s*\]",
              names["mDCBLCoeff"][1],
          ):
              print(
                  "::error::Ukuran array mDCBLCoeff belum dapat "
                  "diverifikasi minimal dua elemen."
              )
              sys.exit(1)

          # Jangan mengubah rumus sebelum seluruh pemeriksaan lulus.
          patched = source.replace(old, new, 1)
          path.write_text(patched)

          print("Patch diterapkan setelah pemeriksaan tipe data.")
          print("Perubahan: menghapus literal floating-point 0.5.")
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail

          FILE="kernel/drivers/gpu/drm/msm/dsi-staging/dsi_panel.c"

          if grep -F \
            'crcValue = 0.5 + mDCBLCoeff[0] * bl_lvl + mDCBLCoeff[1];' \
            "$FILE"; then
            echo "::error::Rumus floating-point masih ditemukan."
            exit 1
          fi

          echo "=== Perubahan source ==="
          git diff -- "$FILE"

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: patched-dsi-panel-source
          path: kernel/drivers/gpu/drm/msm/dsi-staging/dsi_panel.c
          if-no-files-found: error
