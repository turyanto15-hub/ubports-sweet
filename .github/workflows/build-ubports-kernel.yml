name: Audit UBports Sweet Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: techyminati/android_kernel_xiaomi_sweet
          ref: android-11.0
          path: kernel
          persist-credentials: false

      - name: Verify kernel source
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          echo "=== Kernel repository ==="
          git remote get-url origin
          git rev-parse HEAD

          echo "=== Kernel version ==="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)[[:space:]]*=' Makefile

          CONFIG="arch/arm64/configs/vendor/sweet_user_defconfig"
          PANEL="drivers/gpu/drm/msm/dsi-staging/dsi_panel.c"

          test -f "$CONFIG" || {
            echo "::error::Defconfig tidak ditemukan: $CONFIG"
            exit 1
          }

          test -f "$PANEL" || {
            echo "::error::File DSI tidak ditemukan: $PANEL"
            find drivers/gpu/drm -name 'dsi_panel.c' -print
            exit 1
          }

          echo "=== Rumus DSI ==="
          grep -n -F 'crcValue' "$PANEL" || true

          echo "=== AUDIT SOURCE SELESAI ==="
