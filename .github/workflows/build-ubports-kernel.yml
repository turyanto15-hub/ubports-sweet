name: Build UBports Kernel - sweet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Kernel Image
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DIR: kernel
      OUT_DIR: out
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-

    steps:
      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex \
            build-essential gcc-11 g++-11 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            libssl-dev libelf-dev libncurses-dev \
            python3 perl rsync pahole

      - name: Clone kernel source
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth=1 \
            --branch android-11.0 \
            https://github.com/techyminati/android_kernel_xiaomi_sweet.git \
            kernel

          cd kernel

          echo "=== Source commit ==="
          git log -1 --oneline

          echo "=== Kernel version ==="
          make kernelversion

          test -f Makefile
          test -f scripts/config
          test -f arch/arm64/configs/vendor/sweet_user_defconfig

      - name: Select and test GCC cross compiler
        shell: bash
        run: |
          set -euxo pipefail

          CC=/usr/bin/aarch64-linux-gnu-gcc
          HOSTCC=/usr/bin/gcc-11

          test -x "$CC"
          test -x "$HOSTCC"

          echo "=== Target compiler ==="
          "$CC" --version

          echo "=== Host compiler ==="
          "$HOSTCC" --version

          echo "=== Target architecture ==="
          "$CC" -dumpmachine

          printf 'int test(void) { char b[16]; b[0]=0; return b[0]; }\n' \
            > "$RUNNER_TEMP/compiler-test.c"

          "$CC" \
            -fstack-protector-strong \
            -Werror \
            -c "$RUNNER_TEMP/compiler-test.c" \
            -o "$RUNNER_TEMP/compiler-test.o"

          echo "PASS: GCC supports stack protector"

          {
            echo "CC=$CC"
            echo "HOSTCC=$HOSTCC"
            echo "LD=/usr/bin/aarch64-linux-gnu-ld"
          } >> "$GITHUB_ENV"

      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"

          make O="$GITHUB_WORKSPACE/$OUT_DIR" \
            ARCH=arm64 \
            CC="$CC" \
            HOSTCC="$HOSTCC" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LD="$LD" \
            vendor/sweet_user_defconfig \
            2>&1 | tee "$GITHUB_WORKSPACE/config.log"

          CONFIG="$GITHUB_WORKSPACE/$OUT_DIR/.config"
          test -s "$CONFIG"

          echo "=== Initial security configuration ==="
          grep -E \
            'CONFIG_CC_STACKPROTECTOR|CONFIG_CFI|CONFIG_LTO_CLANG' \
            "$CONFIG" || true

          scripts/config --file "$CONFIG" \
            --enable NAMESPACES \
            --enable DEVTMPFS \
            --enable FHANDLE \
            --enable SYSVIPC \
            --enable IPC_NS \
            --enable NET_NS \
            --enable PID_NS \
            --enable USER_NS \
            --enable UTS_NS \
            --enable VT

          make O="$GITHUB_WORKSPACE/$OUT_DIR" \
            ARCH=arm64 \
            CC="$CC" \
            HOSTCC="$HOSTCC" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LD="$LD" \
            olddefconfig \
            2>&1 | tee "$GITHUB_WORKSPACE/olddefconfig.log"

          echo "=== Verify required options ==="

          for option in \
            CONFIG_NAMESPACES \
            CONFIG_DEVTMPFS \
            CONFIG_FHANDLE \
            CONFIG_SYSVIPC \
            CONFIG_IPC_NS \
            CONFIG_NET_NS \
            CONFIG_PID_NS \
            CONFIG_USER_NS \
            CONFIG_UTS_NS \
            CONFIG_VT
          do
            if ! grep -qx "${option}=y" "$CONFIG"; then
              echo "ERROR: $option is not enabled"
              exit 1
            fi
            echo "PASS: ${option}=y"
          done

          echo "=== Final security configuration ==="
          grep -E \
            'CONFIG_CC_STACKPROTECTOR|CONFIG_CFI|CONFIG_LTO_CLANG' \
            "$CONFIG" || true

      - name: Verify compiler through kernel Makefile
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          make -j2 \
            O="$GITHUB_WORKSPACE/$OUT_DIR" \
            ARCH=arm64 \
            CC="$CC" \
            HOSTCC="$HOSTCC" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LD="$LD" \
            prepare \
            2>&1 | tee "$GITHUB_WORKSPACE/prepare.log"

      - name: Compile kernel Image.gz
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          make -j2 \
            O="$GITHUB_WORKSPACE/$OUT_DIR" \
            ARCH=arm64 \
            CC="$CC" \
            HOSTCC="$HOSTCC" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LD="$LD" \
            Image.gz \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          IMAGE="$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image.gz"

          test -s "$IMAGE"

          echo "PASS: Image.gz generated"
          ls -lh "$IMAGE"

      - name: Collect build results
        if: always()
        shell: bash
        run: |
          set -eu

          mkdir -p artifacts

          for file in \
            config.log \
            olddefconfig.log \
            prepare.log \
            build.log
          do
            if [ -s "$GITHUB_WORKSPACE/$file" ]; then
              cp "$GITHUB_WORKSPACE/$file" artifacts/
            fi
          done

          if [ -s out/.config ]; then
            cp out/.config artifacts/kernel.config
          fi

          if [ -s out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz artifacts/
          fi

          if [ -s out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image artifacts/
          fi

          if [ -d kernel/.git ]; then
            git -C kernel log -1 --format='%H%n%s' \
              > artifacts/source-commit.txt
          fi

          ls -lh artifacts || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-ubports-kernel-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
