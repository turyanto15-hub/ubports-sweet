
name: Build UBports Kernel - sweet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Kernel Image
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DIR: kernel
      OUT_DIR: out
      CLANG_TRIPLE: aarch64-linux-gnu-
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-

    steps:
      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex \
            build-essential clang lld llvm \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev libncurses-dev \
            python3 perl rsync pahole

      - name: Clone kernel source
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth=1 \
            --branch android-11.0 \
            https://github.com/techyminati/android_kernel_xiaomi_sweet.git \
            kernel

          cd kernel

          echo "=== Source commit ==="
          git log -1 --oneline

          echo "=== Kernel version ==="
          make kernelversion

          echo "=== Verify defconfig ==="
          test -f arch/arm64/configs/vendor/sweet_user_defconfig

          echo "=== Verify kernel files ==="
          test -f Makefile
          test -f scripts/config

      - name: Select and test compiler
        shell: bash
        run: |
          set -euxo pipefail

          CLANG="$(command -v clang)"
          LLD="$(command -v ld.lld)"

          echo "=== Clang version ==="
          "$CLANG" --version

          echo "=== LLD version ==="
          "$LLD" --version

          echo "=== Compiler stack protector test ==="
          printf 'int test(void) { char b[16]; b[0]=0; return b[0]; }\n' \
            > "$RUNNER_TEMP/compiler-test.c"

          "$CLANG" \
            --target=aarch64-linux-gnu \
            -fstack-protector-strong \
            -Werror \
            -c "$RUNNER_TEMP/compiler-test.c" \
            -o "$RUNNER_TEMP/compiler-test.o"

          echo "PASS: Clang supports -fstack-protector-strong"

          echo "=== Verify compiler target ==="
          "$CLANG" --target=aarch64-linux-gnu -dumpmachine

          {
            echo "CLANG=$CLANG"
            echo "LLD=$LLD"
          } >> "$GITHUB_ENV"

      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"

          make O="$GITHUB_WORKSPACE/$OUT_DIR" \
            ARCH=arm64 \
            CC="$CLANG" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD="$LLD" \
            vendor/sweet_user_defconfig \
            2>&1 | tee "$GITHUB_WORKSPACE/config.log"

          CONFIG="$GITHUB_WORKSPACE/$OUT_DIR/.config"
          test -s "$CONFIG"

          echo "=== Initial compiler/security configuration ==="
          grep -E \
            'CONFIG_(CC_STACKPROTECTOR|CFI|LTO_CLANG)' \
            "$CONFIG" || true

          echo "=== Enable required namespace options ==="
          scripts/config --file "$CONFIG" \
            --enable NAMESPACES \
            --enable DEVTMPFS \
            --enable FHANDLE \
            --enable SYSVIPC \
            --enable IPC_NS \
            --enable NET_NS \
            --enable PID_NS \
            --enable USER_NS \
            --enable UTS_NS \
            --enable VT

          make O="$GITHUB_WORKSPACE/$OUT_DIR" \
            ARCH=arm64 \
            CC="$CLANG" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD="$LLD" \
            olddefconfig \
            2>&1 | tee "$GITHUB_WORKSPACE/olddefconfig.log"

          echo "=== Verify required configuration ==="

          for option in \
            CONFIG_NAMESPACES \
            CONFIG_DEVTMPFS \
            CONFIG_FHANDLE \
            CONFIG_SYSVIPC \
            CONFIG_IPC_NS \
            CONFIG_NET_NS \
            CONFIG_PID_NS \
            CONFIG_USER_NS \
            CONFIG_UTS_NS \
            CONFIG_VT
          do
            if ! grep -qx "${option}=y" "$CONFIG"; then
              echo "ERROR: $option is not enabled"
              exit 1
            fi

            echo "PASS: ${option}=y"
          done

          echo "=== Final compiler/security configuration ==="
          grep -E \
            'CONFIG_(CC_STACKPROTECTOR|CFI|LTO_CLANG)' \
            "$CONFIG" || true

      - name: Diagnose stack protector
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          echo "=== Compiler ==="
          "$CLANG" --version

          echo "=== Stack protector test ==="
          printf 'int main(void) { return 0; }\n' \
            > "$RUNNER_TEMP/sp-test.c"

          "$CLANG" -Werror -fstack-protector-strong \
            -c "$RUNNER_TEMP/sp-test.c" \
            -o "$RUNNER_TEMP/sp-test.o"

          echo "=== Kernel compiler check ==="
          grep -n -C 8 \
            'prepare-compiler-check\|Cannot use CONFIG_CC_STACKPROTECTOR_STRONG' \
            Makefile || true

          echo "=== Kernel stack protector configuration ==="
          grep 'CONFIG_CC_STACKPROTECTOR' \
            "$GITHUB_WORKSPACE/$OUT_DIR/.config" || true

  
      - name: Debug kernel compiler flags
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          echo "=== Clang version ==="
          clang --version

          echo "=== Test stack protector ==="
          printf 'int test(void) { return 0; }\n' > /tmp/test.c

          clang -Werror -fstack-protector-strong \
            -c /tmp/test.c -o /tmp/test.o

          clang --target=aarch64-linux-gnu \
            -Werror -fstack-protector-strong \
            -c /tmp/test.c -o /tmp/test-arm64.o

          echo "=== Stack protector logic in Makefile ==="
          grep -n -A 25 -B 10 \
            'CC_STACKPROTECTOR_STRONG\|prepare-compiler-check' \
            Makefile || true

          echo "=== Compiler flag definitions ==="
          sed -n '450,530p' Makefile

          echo "=== Kernel configuration ==="
          grep 'CONFIG_CC_STACKPROTECTOR' \
            "$GITHUB_WORKSPACE/out/.config" || true

      - name: Inspect stack protector check
        shell: bash
        run: |
          set -eu

          cd kernel

          echo "=== Makefile lines 1285-1320 ==="
          sed -n '1285,1320p' Makefile

          echo "=== Stack protector references ==="
          grep -n -C 5 'CC_STACKPROTECTOR_STRONG' Makefile || true

          echo "=== Compiler test with kernel flags ==="
          mkdir -p "$RUNNER_TEMP/kernel-test"

          printf 'int test(void) { char b[16]; b[0]=0; return b[0]; }\n' \
            > "$RUNNER_TEMP/kernel-test/test.c"

          clang -Werror -fstack-protector-strong \
            -c "$RUNNER_TEMP/kernel-test/test.c" \
            -o "$RUNNER_TEMP/kernel-test/test.o"

          echo "=== Compiler and config ==="
          clang --version
          grep 'CONFIG_CC_STACKPROTECTOR' \
            "$GITHUB_WORKSPACE/out/.config"
            || true
      - name: Verify compiler through kernel Makefile
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          make -j2 \
            O="$GITHUB_WORKSPACE/$OUT_DIR" \
            ARCH=arm64 \
            CC="$CLANG" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD="$LLD" \
            prepare \
            2>&1 | tee "$GITHUB_WORKSPACE/prepare.log"

      - name: Compile kernel Image.gz
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          make -j2 \
            O="$GITHUB_WORKSPACE/$OUT_DIR" \
            ARCH=arm64 \
            CC="$CLANG" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD="$LLD" \
            Image.gz \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          IMAGE="$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image.gz"

          if [ ! -s "$IMAGE" ]; then
            echo "ERROR: Image.gz was not generated"
            exit 1
          fi

          echo "PASS: Image.gz generated"
          ls -lh "$IMAGE"

      - name: Collect build results
        if: always()
        shell: bash
        run: |
          set -eu

          mkdir -p artifacts

          for file in \
            config.log \
            olddefconfig.log \
            prepare.log \
            build.log
          do
            if [ -f "$GITHUB_WORKSPACE/$file" ]; then
              cp "$GITHUB_WORKSPACE/$file" artifacts/
            fi
          done

          if [ -s out/.config ]; then
            cp out/.config artifacts/kernel.config
          fi

          if [ -s out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz artifacts/
          fi

          if [ -s out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image artifacts/
          fi

          if [ -d kernel/.git ]; then
            git -C kernel log -1 --format='%H%n%s' \
              > artifacts/source-commit.txt
          fi

          echo "=== Collected artifacts ==="
          ls -lh artifacts || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-ubports-kernel-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
