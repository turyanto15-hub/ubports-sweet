name: UBports Halium Config Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Test Halium Kernel Options
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev

      - name: Clone kernel source
        run: |
          set -eu
          git clone --depth=1 \
            --branch android-11.0 \
            https://github.com/techyminati/android_kernel_xiaomi_sweet.git \
            kernel

      - name: Generate original config
        shell: bash
        run: |
          set -eu
          set -o pipefail

          cd kernel
          mkdir -p "$GITHUB_WORKSPACE/out"

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            vendor/sweet_user_defconfig \
            2>&1 | tee "$GITHUB_WORKSPACE/config-build.log"

          test -s "$GITHUB_WORKSPACE/out/.config"

      - name: Test Halium options
        shell: bash
        run: |
          set -eu
          set -o pipefail

          cd kernel
          CONFIG="$GITHUB_WORKSPACE/out/.config"

          echo "=== Enable requested options for testing ==="

          scripts/config --file "$CONFIG" \
            --enable NAMESPACES \
            --enable DEVTMPFS \
            --enable FHANDLE \
            --enable SYSVIPC \
            --enable IPC_NS \
            --enable NET_NS \
            --enable PID_NS \
            --enable USER_NS \
            --enable UTS_NS \
            --enable VT

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            olddefconfig \
            2>&1 | tee "$GITHUB_WORKSPACE/olddefconfig.log"

          echo
          echo "=== Results after olddefconfig ==="

          for option in \
            CONFIG_NAMESPACES \
            CONFIG_DEVTMPFS \
            CONFIG_FHANDLE \
            CONFIG_SYSVIPC \
            CONFIG_IPC_NS \
            CONFIG_NET_NS \
            CONFIG_PID_NS \
            CONFIG_USER_NS \
            CONFIG_UTS_NS \
            CONFIG_VT
          do
            if grep -qx "${option}=y" "$CONFIG"; then
              echo "PASS: ${option}=y"
            elif grep -qx "# ${option} is not set" "$CONFIG"; then
              echo "CHECK: ${option} disabled by configuration"
            else
              echo "CHECK: ${option} missing or has another value"
            fi
          done

      - name: Upload config and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-halium-config-test
          path: |
            out/.config
            config-build.log
            olddefconfig.log
          if-no-files-found: warn
