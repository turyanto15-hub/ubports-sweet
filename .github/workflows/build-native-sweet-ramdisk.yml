
name: Build Native Sweet RAMDISK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Native Sweet RootFS"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build-ramdisk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            wget \
            bzip2 \
            cpio \
            gzip \
            file \
            qemu-user \
            findutils \
            python3

      - name: Download BusyBox
        run: |
          set -eux
          wget -O busybox.tar.bz2 \
            https://busybox.net/downloads/busybox-1.37.0.tar.bz2

          tar -xjf busybox.tar.bz2
          mv busybox-1.37.0 busybox

      - name: Configure BusyBox non-interactively
        working-directory: busybox
        run: |
          set -eux

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig

          # Resolve all new configuration options using defaults.
          yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oldconfig

          # Apply required configuration changes.
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(".config")
          config = path.read_text()

          required = {
              "STATIC": "y",
              "MDEV": "y",
              "LOSETUP": "y",
              "SWITCH_ROOT": "y",
              "MKNOD": "y",
              "SHA1_HWACCEL": "n",
              "SHA256_HWACCEL": "n",
          }

          for name, value in required.items():
              pattern = (
                  rf"^CONFIG_{re.escape(name)}=.*$"
                  rf"|^# CONFIG_{re.escape(name)} is not set$"
              )

              replacement = (
                  f"CONFIG_{name}={value}"
                  if value == "y"
                  else f"# CONFIG_{name} is not set"
              )

              config, count = re.subn(
                  pattern,
                  replacement,
                  config,
                  flags=re.MULTILINE
              )

              if count == 0:
                  config += f"\n{replacement}\n"

          path.write_text(config)
          PY

          # Reprocess the modified configuration non-interactively.
          yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oldconfig

          echo "===== VERIFY BUSYBOX CONFIGURATION ====="

          grep -qx 'CONFIG_STATIC=y' .config
          grep -qx 'CONFIG_MDEV=y' .config
          grep -qx 'CONFIG_LOSETUP=y' .config
          grep -qx 'CONFIG_SWITCH_ROOT=y' .config
          grep -qx 'CONFIG_MKNOD=y' .config

          grep -qx '# CONFIG_SHA1_HWACCEL is not set' .config
          grep -qx '# CONFIG_SHA256_HWACCEL is not set' .config

          echo "BUSYBOX CONFIGURATION PASSED"

      - name: Build static ARM64 BusyBox
        working-directory: busybox
        run: |
          set -eux

          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CFLAGS="-Wno-error=unused-result"

          file busybox

          aarch64-linux-gnu-readelf -h busybox \
            | grep -E 'Class:|Machine:'

          aarch64-linux-gnu-readelf -l busybox \
            | tee /tmp/busybox-headers.txt

          if grep -q INTERP /tmp/busybox-headers.txt; then
            echo "ERROR: BusyBox is dynamically linked"
            exit 1
          fi

          echo "STATIC ARM64 BUSYBOX BUILD PASSED"

      - name: Verify BusyBox applets
        working-directory: busybox
        run: |
          set -eux

          qemu-aarch64 ./busybox --list > /tmp/applets.txt

          for applet in \
            sh mount umount mkdir mknod sleep cat \
            dmesg grep ls readlink losetup switch_root mdev
          do
            grep -qx "$applet" /tmp/applets.txt
          done

          echo "REQUIRED APPLETS PASSED"

      - name: Create Native Sweet initramfs
        run: |
          set -eux

          mkdir -p ramdisk/bin
          mkdir -p ramdisk/sbin
          mkdir -p ramdisk/dev
          mkdir -p ramdisk/proc
          mkdir -p ramdisk/sys
          mkdir -p ramdisk/run
          mkdir -p ramdisk/mnt/sd
          mkdir -p ramdisk/newroot

          cp busybox/busybox ramdisk/bin/busybox

          for applet in \
            sh mount umount mkdir mknod sleep cat \
            dmesg grep ls readlink
          do
            ln -sf busybox "ramdisk/bin/$applet"
          done

          for applet in mdev losetup switch_root
          do
            ln -sf ../bin/busybox "ramdisk/sbin/$applet"
          done

          cat > ramdisk/init <<'INIT'
          #!/bin/sh

          export PATH=/bin:/sbin

          echo
          echo "======================================"
          echo " Native UBports Sweet Initramfs"
          echo "======================================"

          mount -t devtmpfs devtmpfs /dev
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys

          mkdir -p /run /mnt/sd /newroot

          if [ ! -e /dev/loop0 ]; then
              mknod -m 660 /dev/loop0 b 7 0
          fi

          echo "Scanning microSD partitions..."

          FOUND=""

          for PART in /sys/class/block/mmcblk*p*; do
              [ -e "$PART" ] || continue

              DEV="/dev/$(basename "$PART")"
              echo "Checking $DEV"

              if mount -t ext4 -o rw "$DEV" /mnt/sd 2>/dev/null; then
                  if [ -f /mnt/sd/system.img ]; then
                      FOUND="$DEV"
                      echo "Found system.img on $DEV"
                      break
                  fi

                  umount /mnt/sd
              fi
          done

          if [ -z "$FOUND" ]; then
              echo "ERROR: system.img not found on microSD"
              exec sh
          fi

          echo "Attaching system.img..."

          if ! losetup /dev/loop0 /mnt/sd/system.img; then
              echo "ERROR: losetup failed"
              exec sh
          fi

          echo "Mounting root filesystem..."

          if ! mount -t ext4 -o rw /dev/loop0 /newroot; then
              echo "ERROR: cannot mount system.img"
              exec sh
          fi

          if [ ! -x /newroot/sbin/init ]; then
              echo "ERROR: /sbin/init not found"
              exec sh
          fi

          mkdir -p /newroot/dev
          mkdir -p /newroot/proc
          mkdir -p /newroot/sys
          mkdir -p /newroot/run
          mkdir -p /newroot/mnt/sd

          mount --move /dev /newroot/dev
          mount --move /proc /newroot/proc
          mount --move /sys /newroot/sys
          mount --move /mnt/sd /newroot/mnt/sd

          echo "Switching root..."

          exec switch_root -c /dev/console /newroot /sbin/init

          echo "ERROR: switch_root failed"
          exec sh
          INIT

          chmod 0755 ramdisk/init

          cat > ramdisk/RAMDISK-MANIFEST.txt <<'EOF'
          Native UBports Sweet RAMDISK
          Device: Redmi Note 10 Pro (sweet)
          Architecture: ARM64
          BusyBox: 1.37.0 static
          Initramfs: gzip cpio newc
          Root image: system.img
          microSD filesystem: ext4
          Root image filesystem: ext4
          Boot flow: initramfs -> loop device -> switch_root
          EOF

      - name: Package initramfs
        run: |
          set -eux

          cd ramdisk

          find . -print0 | sort -z | \
            cpio --null -o -H newc --owner=0:0 | gzip -9 \
            > ../native-sweet-ramdisk.cpio.gz

          cd ..

          file native-sweet-ramdisk.cpio.gz
          ls -lh native-sweet-ramdisk.cpio.gz

          sha256sum native-sweet-ramdisk.cpio.gz > SHA256SUMS

      - name: Validate initramfs
        run: |
          set -eux

          mkdir verify

          gzip -dc native-sweet-ramdisk.cpio.gz | \
            (cd verify && cpio -idm --no-absolute-filenames)

          test -x verify/init
          test -x verify/bin/busybox
          test -L verify/bin/sh
          test -L verify/sbin/losetup
          test -L verify/sbin/switch_root
          test -L verify/sbin/mdev

          grep -q system.img verify/init
          grep -q losetup verify/init
          grep -q switch_root verify/init

          echo "INITRAMFS VALIDATION PASSED"

      - name: Upload RAMDISK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE-UBPORT-SWEET-RAMDISK
          path: |
            native-sweet-ramdisk.cpio.gz
            SHA256SUMS
            ramdisk/RAMDISK-MANIFEST.txt
          if-no-files-found: error
          retention-days: 30
