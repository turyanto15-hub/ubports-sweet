
name: Build Native Sweet RAMDISK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Native Sweet RootFS"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build-ramdisk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            wget \
            bzip2 \
            cpio \
            gzip \
            file \
            qemu-user \
            findutils

      - name: Download BusyBox
        run: |
          set -eux
          wget -O busybox.tar.bz2 \
            https://busybox.net/downloads/busybox-1.37.0.tar.bz2

          tar -xjf busybox.tar.bz2
          mv busybox-1.37.0 busybox

      - name: Configure BusyBox
        working-directory: busybox
        run: |
          set -eux

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig

          sed -i \
            -e 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' \
            -e 's/^# CONFIG_MDEV is not set/CONFIG_MDEV=y/' \
            -e 's/^# CONFIG_LOSETUP is not set/CONFIG_LOSETUP=y/' \
            -e 's/^# CONFIG_SWITCH_ROOT is not set/CONFIG_SWITCH_ROOT=y/' \
            -e 's/^# CONFIG_FEATURE_MOUNT_LOOP is not set/CONFIG_FEATURE_MOUNT_LOOP=y/' \
            -e 's/^# CONFIG_MKNOD is not set/CONFIG_MKNOD=y/' \
            .config

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oldconfig </dev/null

          echo "===== BUSYBOX CONFIG ====="
          grep -E '^CONFIG_(STATIC|MDEV|LOSETUP|SWITCH_ROOT|FEATURE_MOUNT_LOOP|MKNOD)=' .config

      - name: Fix watchdog warning
        working-directory: busybox
        run: |
          set -eux

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("miscutils/watchdog.c")
          source = path.read_text()

          patterns = [
              (
                  r'(?m)^([ \t]*)write\(\s*3\s*,\s*""\s*,\s*1\s*\)\s*;([ \t]*(?:/\*.*?\*/)?[ \t]*)$',
                  'if (write(3, "", 1) < 0) { }'
              ),
              (
                  r'(?m)^([ \t]*)write\(\s*3\s*,\s*&V\s*,\s*1\s*\)\s*;([ \t]*(?:/\*.*?\*/)?[ \t]*)$',
                  'if (write(3, &V, 1) < 0) { }'
              )
          ]

          for pattern, replacement in patterns:
              source, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + replacement + m.group(2),
                  source
              )

              if count != 1:
                  raise SystemExit(
                      f"Watchdog patch failed: expected 1 match, found {count}"
                  )

          path.write_text(source)

          updated = path.read_text()

          if re.search(r'(?m)^\s*write\(\s*3\s*,\s*""\s*,\s*1\s*\)\s*;', updated):
              raise SystemExit("First watchdog warning remains")

          if re.search(r'(?m)^\s*write\(\s*3\s*,\s*&V\s*,\s*1\s*\)\s*;', updated):
              raise SystemExit("Second watchdog warning remains")

          print("Both watchdog write calls patched successfully.")
          PY

          echo "===== PATCHED WATCHDOG ====="
          grep -n -C 2 'write(3' miscutils/watchdog.c

      - name: Build static ARM64 BusyBox
        working-directory: busybox
        run: |
          set -eux

          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CFLAGS="-Wno-error=unused-result"

          file busybox

          aarch64-linux-gnu-readelf -h busybox | grep -E 'Class:|Machine:'

          aarch64-linux-gnu-readelf -l busybox \
            | tee /tmp/busybox-program-headers.txt

          if grep -q INTERP /tmp/busybox-program-headers.txt; then
            echo "ERROR: BusyBox is dynamically linked"
            exit 1
          fi

          echo "STATIC ARM64 BUSYBOX BUILD PASSED"

      - name: Verify BusyBox applets
        working-directory: busybox
        run: |
          set -eux

          qemu-aarch64 ./busybox --list > /tmp/applets.txt

          for applet in \
            sh \
            mount \
            umount \
            mkdir \
            mknod \
            sleep \
            cat \
            uname \
            dmesg \
            ls \
            grep \
            head \
            tail \
            wc \
            readlink \
            losetup \
            switch_root \
            mdev
          do
            grep -qx "$applet" /tmp/applets.txt
          done

          echo "ALL REQUIRED BUSYBOX APPLETS PASSED"

      - name: Create initramfs
        run: |
          set -eux

          mkdir -p ramdisk/bin
          mkdir -p ramdisk/sbin
          mkdir -p ramdisk/dev
          mkdir -p ramdisk/proc
          mkdir -p ramdisk/sys
          mkdir -p ramdisk/run
          mkdir -p ramdisk/mnt/sd
          mkdir -p ramdisk/newroot

          cp busybox/busybox ramdisk/bin/busybox

          ln -sf ../bin/busybox ramdisk/sbin/mdev

          for applet in \
            sh mount umount mkdir mknod sleep cat \
            dmesg grep ls readlink
          do
            ln -sf ../bin/busybox "ramdisk/bin/$applet"
          done

          ln -sf ../bin/busybox ramdisk/sbin/losetup
          ln -sf ../bin/busybox ramdisk/sbin/switch_root

          cat > ramdisk/init <<'INIT'
          #!/bin/sh

          export PATH=/bin:/sbin

          echo
          echo "======================================"
          echo " Native UBports Sweet Initramfs"
          echo "======================================"

          mount -t devtmpfs devtmpfs /dev
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys

          mkdir -p /run
          mkdir -p /mnt/sd
          mkdir -p /newroot

          if [ ! -e /dev/loop0 ]; then
              mknod -m 660 /dev/loop0 b 7 0
          fi

          echo "Scanning microSD ext4 partitions..."

          FOUND=""

          for PART in /sys/class/block/mmcblk*p*; do
              [ -e "$PART" ] || continue

              DEV="/dev/$(basename "$PART")"

              echo "Checking $DEV"

              if mount -t ext4 -o rw "$DEV" /mnt/sd 2>/dev/null; then
                  if [ -f /mnt/sd/system.img ]; then
                      FOUND="$DEV"
                      echo "Found system.img on $DEV"
                      break
                  fi

                  umount /mnt/sd
              fi
          done

          if [ -z "$FOUND" ]; then
              echo "ERROR: system.img not found on ext4 microSD"
              exec sh
          fi

          echo "Attaching system.img..."

          if ! losetup /dev/loop0 /mnt/sd/system.img; then
              echo "ERROR: Cannot attach system.img"
              exec sh
          fi

          echo "Mounting root filesystem..."

          if ! mount -t ext4 -o rw /dev/loop0 /newroot; then
              echo "ERROR: Cannot mount ext4 system.img"
              exec sh
          fi

          if [ ! -x /newroot/sbin/init ]; then
              echo "ERROR: /sbin/init missing in system.img"
              exec sh
          fi

          echo "Root filesystem found."

          mkdir -p /newroot/dev
          mkdir -p /newroot/proc
          mkdir -p /newroot/sys
          mkdir -p /newroot/run
          mkdir -p /newroot/mnt/sd

          mount -t tmpfs tmpfs /newroot/run

          mount --move /dev /newroot/dev
          mount --move /proc /newroot/proc
          mount --move /sys /newroot/sys
          mount --move /mnt/sd /newroot/mnt/sd

          echo "Switching to Native UBports root filesystem..."

          exec switch_root -c /dev/console /newroot /sbin/init

          echo "ERROR: switch_root failed"
          exec sh
          INIT

          chmod 0755 ramdisk/init

          cat > ramdisk/RAMDISK-MANIFEST.txt <<'EOF'
          Native UBports Sweet RAMDISK
          Device: Xiaomi Redmi Note 10 Pro (sweet)
          Architecture: ARM64
          Initramfs: gzip-compressed cpio
          BusyBox: static ARM64
          Root filesystem image: system.img
          microSD partition filesystem: ext4
          Root filesystem filesystem: ext4
          Boot mode: initramfs -> loop device -> switch_root
          EOF

      - name: Package initramfs
        run: |
          set -eux

          cd ramdisk

          find . -print0 | sort -z | \
            cpio --null -o -H newc --owner=0:0 | gzip -9 \
            > ../native-sweet-ramdisk.cpio.gz

          cd ..

          file native-sweet-ramdisk.cpio.gz
          ls -lh native-sweet-ramdisk.cpio.gz

          sha256sum native-sweet-ramdisk.cpio.gz > SHA256SUMS

      - name: Validate initramfs
        run: |
          set -eux

          mkdir verify

          gzip -dc native-sweet-ramdisk.cpio.gz | \
            (cd verify && cpio -idm --no-absolute-filenames)

          test -x verify/init
          test -x verify/bin/busybox
          test -L verify/bin/sh
          test -L verify/sbin/losetup
          test -L verify/sbin/switch_root
          test -L verify/sbin/mdev

          grep -q 'system.img' verify/init
          grep -q 'mount -t ext4' verify/init
          grep -q 'losetup' verify/init
          grep -q 'switch_root' verify/init
          grep -q 'mknod' verify/init

          echo "===== INITRAMFS VALIDATION PASSED ====="

          find verify -maxdepth 3 \( -type f -o -type l \) | sort

      - name: Upload RAMDISK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE-UBPORT-SWEET-RAMDISK
          path: |
            native-sweet-ramdisk.cpio.gz
            SHA256SUMS
            ramdisk/RAMDISK-MANIFEST.txt
          if-no-files-found: error
          retention-days: 30
